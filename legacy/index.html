<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Daftarbox – Free PDF, photo, document, audio and video tools</title>
<meta name="description" content="Free online tools to merge, split, compress and sign PDFs, convert Word, images, contacts and spreadsheets, compress and resize photos, and edit audio and video. Files are processed on your device.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,300..900&family=Caveat:wght@500&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#F4F5F7; --surface:#FFFFFF; --sunk:#ECEEF2; --ink:#15181E; --muted:#596070;
  --line:#D8DBE2; --brand:#1D3B8F; --brand-ink:#FFFFFF; --brand-soft:#E3E9F8;
  --hl:#FFE45C; --hl-ink:#15181E; --danger:#B42318; --ok:#17784A;
  --wave:#1D3B8F; --sel:rgba(255,214,0,.38);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#101319; --surface:#181C24; --sunk:#0C0F14; --ink:#E8EBF1; --muted:#9BA2B0;
    --line:#2A303B; --brand:#93A9FF; --brand-ink:#0D1220; --brand-soft:#1E2640;
    --hl:#EAD14B; --hl-ink:#15181E; --danger:#FF8F84; --ok:#71D39E;
    --wave:#93A9FF; --sel:rgba(234,209,75,.30);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101319; --surface:#181C24; --sunk:#0C0F14; --ink:#E8EBF1; --muted:#9BA2B0;
  --line:#2A303B; --brand:#93A9FF; --brand-ink:#0D1220; --brand-soft:#1E2640;
  --hl:#EAD14B; --hl-ink:#15181E; --danger:#FF8F84; --ok:#71D39E;
  --wave:#93A9FF; --sel:rgba(234,209,75,.30);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 72px)}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
img,canvas,video{max-width:100%}
a{color:var(--brand)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
h1:focus,main:focus{outline:none}

/* Header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-in{max-width:1180px;margin:0 auto;padding:0 20px;display:flex;align-items:center;gap:28px;height:60px}
.mark{font-stretch:125%;font-weight:850;font-size:1.25rem;letter-spacing:-.01em;color:var(--ink);text-decoration:none;white-space:nowrap}
.mark span{display:inline-block;width:.62em;height:.62em;background:var(--hl);margin-right:.32em;vertical-align:.02em;border:2px solid var(--ink)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1}
.nav::-webkit-scrollbar{display:none}
.nav a{white-space:nowrap;text-decoration:none;color:var(--muted);padding:8px 12px;border-radius:6px;font-weight:550;font-size:.95rem}
.nav a:hover{color:var(--ink);background:var(--sunk)}
.nav a[aria-current="page"]{color:var(--ink);background:var(--hl);color:var(--hl-ink)}

main{max-width:1180px;margin:0 auto;padding:0 20px 80px}

/* Home hero */
.hero{padding:56px 0 40px}
.hero h1{font-stretch:125%;font-weight:850;font-size:clamp(2.5rem,7.4vw,5.6rem);line-height:.95;letter-spacing:-.035em;margin:0 0 20px;max-width:12ch}
.hero > p{color:var(--muted);font-size:1.12rem;max-width:56ch;margin:0 0 28px}
.drop{position:relative;border:2px dashed var(--line);border-radius:14px;background:var(--surface);padding:36px 28px;display:flex;align-items:center;gap:24px;flex-wrap:wrap;transition:background .12s,border-color .12s}
.drop.drag{background:var(--hl);border-color:var(--hl-ink);color:var(--hl-ink)}
.drop.drag .drop-sub{color:var(--hl-ink)}
.drop-txt{flex:1;min-width:220px}
.drop-big{font-stretch:112%;font-weight:750;font-size:1.35rem;line-height:1.2;margin:0 0 4px}
.drop-sub{color:var(--muted);margin:0;font-size:.95rem}
.drop input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.picks{margin-top:18px}
.picks h2{font-size:1.05rem;font-weight:650;margin:0 0 10px}
.picks .row{display:flex;flex-wrap:wrap;gap:8px}

/* Directory */
.cat{padding:40px 0 8px;border-top:2px solid var(--ink)}
.cat:first-of-type{border-top-width:2px}
.cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.cat h2{font-stretch:125%;font-weight:800;font-size:clamp(1.5rem,3.2vw,2.1rem);letter-spacing:-.02em;margin:0}
.cat-head p{margin:0;color:var(--muted)}
.tools{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));column-gap:28px}
.tools li{border-top:1px solid var(--line)}
.tools a{display:block;padding:14px 0 16px;text-decoration:none;color:var(--ink)}
.tools a:hover .tn{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px}
.tn{font-weight:700;font-size:1.05rem;display:block}
.td{color:var(--muted);font-size:.93rem;display:block;margin-top:2px}
.tag{display:inline-block;font-size:.75rem;font-weight:650;padding:1px 8px;border-radius:99px;background:var(--sunk);color:var(--muted);margin-left:6px;vertical-align:2px}

/* Buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid transparent;border-radius:8px;padding:11px 18px;font-weight:650;cursor:pointer;background:var(--brand);color:var(--brand-ink);text-decoration:none;line-height:1.2}
.btn:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.5;cursor:not-allowed;filter:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{background:var(--sunk);filter:none}
.btn.small{padding:6px 11px;font-size:.88rem;border-radius:6px}
.btn.wide{width:100%}
.icon-btn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:32px;height:32px;display:inline-grid;place-items:center;cursor:pointer;padding:0}
.icon-btn:hover{background:var(--sunk)}
.icon-btn svg{width:16px;height:16px}
label.f{display:block;margin:0 0 14px;font-weight:600;font-size:.92rem}
label.f > span.h{display:block;font-weight:400;color:var(--muted);font-size:.85rem;margin-top:2px}
.f input[type=text],.f input[type=number],.f select,.f textarea{display:block;width:100%;margin-top:6px;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);font-weight:400}
.f input[type=range]{width:100%;margin-top:8px;accent-color:var(--brand)}
.check{display:flex;gap:8px;align-items:flex-start;margin:0 0 14px;font-size:.92rem;font-weight:500}
.check input{margin-top:4px;accent-color:var(--brand)}
.radios{display:flex;flex-direction:column;gap:6px;margin:6px 0 0;font-weight:400}
.radios label{display:flex;gap:8px;align-items:center}
.radios input{accent-color:var(--brand)}

/* Tool page */
.crumbs{padding:28px 0 0;font-size:.92rem;color:var(--muted)}
.crumbs a{color:var(--muted)}
.tool-head{padding:10px 0 24px}
.tool-head h1{font-stretch:125%;font-weight:850;font-size:clamp(2rem,5vw,3.4rem);letter-spacing:-.03em;line-height:1;margin:0 0 10px}
.tool-head p{margin:0;color:var(--muted);max-width:62ch;font-size:1.05rem}
.work{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:24px;align-items:start}
@media (max-width:860px){.work{grid-template-columns:1fr}}
.opts{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}
@media (max-width:860px){.opts{position:static}}
.opts h2{font-size:1rem;margin:0 0 14px;font-weight:700}
.note{font-size:.86rem;color:var(--muted);background:var(--sunk);border-radius:6px;padding:10px 12px;margin:0 0 14px}
.files{background:var(--surface);border:1px solid var(--line);border-radius:10px}
.files ul{list-style:none;margin:0;padding:0}
.files li{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line)}
.files li:last-child{border-bottom:0}
.fi-num{font-variant-numeric:tabular-nums;color:var(--muted);width:1.6em;text-align:right;font-size:.9rem}
.fi-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:550}
.fi-size{color:var(--muted);font-size:.88rem;white-space:nowrap}
.fi-act{display:flex;gap:6px}
.files-foot{padding:12px 14px;border-top:1px solid var(--line);display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.files .drop{border:0;border-radius:10px}
.status{min-height:1.4em;margin:12px 0 0;font-size:.92rem}
.status.err{color:var(--danger);font-weight:550}
.status.ok{color:var(--ok);font-weight:550}
progress{width:100%;height:8px;margin-top:12px;accent-color:var(--brand)}
.results{margin-top:28px;background:var(--surface);border:2px solid var(--ink);border-radius:10px;padding:20px}
.results h2{font-stretch:115%;font-weight:800;font-size:1.4rem;margin:0 0 6px}
.results .sum{margin:0 0 14px;color:var(--muted)}
.results ul{list-style:none;margin:0 0 14px;padding:0}
.results li{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.results-foot{display:flex;gap:10px;flex-wrap:wrap}

/* Organize thumbnails */
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(132px,1fr));gap:14px;padding:14px}
.thumb{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px;display:flex;flex-direction:column;align-items:center;gap:6px;cursor:grab;user-select:none}
.thumb.dragging{opacity:.4}
.thumb.over{outline:2px dashed var(--brand);outline-offset:2px}
.thumb-img{height:150px;display:grid;place-items:center;width:100%}
.thumb canvas{max-height:146px;max-width:100%;box-shadow:0 0 0 1px var(--line);background:#fff;transition:transform .15s}
.thumb-bar{display:flex;gap:4px;align-items:center;width:100%;justify-content:space-between}
.thumb-n{font-size:.82rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Sign */
.sigpad{display:block;width:100%;height:170px;background:#fff;border:1px solid var(--line);border-radius:8px;touch-action:none;cursor:crosshair}
.tabs{display:flex;gap:4px;margin:0 0 10px}
.tabs button{border:1px solid var(--line);background:transparent;border-radius:6px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.place-wrap{position:relative;display:inline-block;max-width:100%;line-height:0;cursor:copy;box-shadow:0 0 0 1px var(--line)}
.place-wrap canvas{display:block;background:#fff}
.place-wrap img{position:absolute;pointer-events:none;outline:1px dashed var(--brand)}
.stage{padding:14px;text-align:center;overflow:auto}
.stage-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line)}

/* Crop */
.crop-wrap{position:relative;display:inline-block;max-width:100%;line-height:0;overflow:hidden;touch-action:none;cursor:crosshair;user-select:none;box-shadow:0 0 0 1px var(--line)}
.crop-wrap canvas{display:block;max-width:100%;max-height:65vh;width:auto;height:auto}
.crop-box{position:absolute;border:2px solid #fff;outline:1px dashed #000;box-shadow:0 0 0 9999px rgba(0,0,0,.5);pointer-events:none}

/* Audio / video */
.wave-wrap{padding:14px}
canvas.wave{display:block;width:100%;height:170px;background:var(--bg);border:1px solid var(--line);border-radius:8px;cursor:text;touch-action:none}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:0 14px 14px}
.time{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.92rem;margin-left:auto}
.vwrap{padding:14px}
.vwrap video{display:block;width:100%;max-height:60vh;background:#000;border-radius:8px}
.inline-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Remote */
.soon{max-width:720px}
.soon h2{font-size:1.15rem;margin:28px 0 8px}
.soon p{max-width:64ch}
.soon ul{padding-left:1.2em}
.soon li{margin:4px 0}

footer{border-top:1px solid var(--line);color:var(--muted);font-size:.88rem}
footer div{max-width:1180px;margin:0 auto;padding:22px 20px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header class="top">
  <div class="top-in">
    <a class="mark" href="../index.html" title="All portals"><span aria-hidden="true"></span>Daftarbox</a>
    <nav class="nav" id="nav" aria-label="Tool categories"></nav>
  </div>
</header>
<main id="app" tabindex="-1"></main>
<footer><div>Daftarbox. Free tools that run in your browser: your files are processed on your device and are never uploaded.</div></footer>

<script>
"use strict";
/* ---------- Basics ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtSize = b => b < 1024 ? b + " B" : b < 1048576 ? (b/1024).toFixed(1) + " KB" : (b/1048576).toFixed(1) + " MB";
const baseName = n => n.replace(/\.[^.]+$/, "");
const extOf = n => ((n.match(/\.([^.]+)$/) || [, ""])[1]).toLowerCase();
const fmtTime = s => { s = Math.max(0, s); const m = Math.floor(s/60); const r = (s - m*60).toFixed(2).padStart(5, "0"); return m + ":" + r; };
const sleep = ms => new Promise(r => setTimeout(r, ms));
const once = (el, ev) => new Promise((res, rej) => { el.addEventListener(ev, res, {once:true}); if (ev !== "error") el.addEventListener("error", () => rej(new Error("This file couldn't be opened by your browser.")), {once:true}); });
const pdfBlob = bytes => new Blob([bytes], {type:"application/pdf"});
const canvasBlob = (c, type, q) => new Promise((res, rej) => c.toBlob(b => b ? res(b) : rej(new Error("The image couldn't be created. Try a lower quality setting.")), type, q));
const ICON = {
  up:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 13V3M3.5 7.5 8 3l4.5 4.5"/></svg>',
  down:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M8 3v10M3.5 8.5 8 13l4.5-4.5"/></svg>',
  left:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 8H3M7.5 3.5 3 8l4.5 4.5"/></svg>',
  right:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M3 8h10M8.5 3.5 13 8l-4.5 4.5"/></svg>',
  x:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 4l8 8M12 4l-8 8"/></svg>',
  rot:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M13 8a5 5 0 1 1-1.6-3.7M13 2.5v3h-3"/></svg>'
};

/* ---------- Library loader (loaded only when a tool needs it) ---------- */
const CDN = {
  pdflib: ["https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"],
  pdfjs: ["https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js", "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"],
  jszip: ["https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"],
  mammoth: ["https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"],
  xlsx: ["https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"]
};
const scriptP = {};
function loadScript(url) {
  if (scriptP[url]) return scriptP[url];
  return scriptP[url] = new Promise((res, rej) => {
    const s = document.createElement("script");
    s.src = url; s.async = false;
    s.onload = res;
    s.onerror = () => { delete scriptP[url]; s.remove(); rej(new Error("A required component didn't load. Check your internet connection and try again.")); };
    document.head.appendChild(s);
  });
}
async function need(...names) {
  for (const n of names) for (const u of CDN[n]) await loadScript(u);
  if (names.includes("pdfjs") && window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = CDN.pdfjs[0];
}

/* ---------- Saving files ---------- */
const dlCap = (window.claude && typeof window.claude.use === "function")
  ? window.claude.use("downloads").catch(() => null) : Promise.resolve(null);
async function saveFile(name, blob) {
  const dl = await dlCap;
  if (dl) {
    try { await dl.save({filename: name, data: blob}); return "saved"; }
    catch (e) {
      const code = e && e.code;
      if (code === "declined") return "declined";
      if (code === "rate_limited") throw new Error("A save is already waiting for your answer. Finish that one first.");
      if (code === "rejected_extension" || code === "extension_not_enabled") {
        await need("jszip");
        const z = new JSZip(); z.file(name, blob);
        return saveFile(baseName(name) + ".zip", await z.generateAsync({type:"blob"}));
      }
      if (code === "too_large") throw new Error("This file is too large to save here.");
      /* any other code: fall back to a normal browser download */
    }
  }
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 5000);
  return "saved";
}
async function zipAll(outs) {
  await need("jszip");
  const z = new JSZip(); const used = {};
  for (const o of outs) { let n = o.name; if (used[n]) n = baseName(n) + "-" + (used[n]++) + "." + extOf(n); else used[n] = 1; z.file(n, o.blob); }
  return z.generateAsync({type:"blob"});
}

/* ---------- PDF helpers ---------- */
async function loadPL(file) {
  let doc;
  try { doc = await PDFLib.PDFDocument.load(await file.arrayBuffer(), {ignoreEncryption:true}); }
  catch (e) { throw new Error(file.name + " couldn't be read as a PDF. It may be damaged or not a real PDF."); }
  if (doc.isEncrypted) throw new Error(file.name + " is password-protected. Remove the password first, then try again.");
  return doc;
}
async function pdfjsOpen(file) {
  await need("pdfjs");
  const data = new Uint8Array(await file.arrayBuffer());
  try { return await pdfjsLib.getDocument({data, isEvalSupported:false}).promise; }
  catch (e) {
    if (e && e.name === "PasswordException") throw new Error(file.name + " is password-protected. Remove the password first, then try again.");
    throw new Error(file.name + " couldn't be read as a PDF. It may be damaged.");
  }
}
async function renderPage(page, scale) {
  let vp = page.getViewport({scale});
  const maxPx = 14e6;
  if (vp.width * vp.height > maxPx) { scale *= Math.sqrt(maxPx / (vp.width * vp.height)); vp = page.getViewport({scale}); }
  const c = document.createElement("canvas");
  c.width = Math.ceil(vp.width); c.height = Math.ceil(vp.height);
  const ctx = c.getContext("2d");
  ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
  await page.render({canvasContext: ctx, viewport: vp}).promise;
  return c;
}
async function subsetPdf(src, idxs) {
  const d = await PDFLib.PDFDocument.create();
  const ps = await d.copyPages(src, idxs);
  ps.forEach(p => d.addPage(p));
  return pdfBlob(await d.save());
}
function parseRanges(str, total) {
  const s = (str || "").trim();
  if (!s) throw new Error("Enter the pages, for example 1-3, 5.");
  const groups = [];
  for (const raw of s.split(/[,;]+/)) {
    const tok = raw.trim(); if (!tok) continue;
    let a, b; const m = tok.match(/^(\d*)\s*-\s*(\d*)$/);
    if (m && (m[1] || m[2])) { a = m[1] ? +m[1] : 1; b = m[2] ? +m[2] : total; }
    else if (/^\d+$/.test(tok)) { a = b = +tok; }
    else throw new Error('"' + tok + '" isn\'t a page or a range. Use numbers like 2 or 4-7.');
    if (a < 1 || b < 1) throw new Error("Page numbers start at 1.");
    if (a > total || b > total) throw new Error("This PDF has " + total + " page" + (total === 1 ? "" : "s") + ", so page " + Math.max(a, b) + " doesn't exist.");
    const idx = []; const dir = a <= b ? 1 : -1; for (let i = a; i !== b + dir; i += dir) idx.push(i - 1);
    groups.push({label: a === b ? String(a) : a + "-" + b, idx});
  }
  if (!groups.length) throw new Error("Enter the pages, for example 1-3, 5.");
  return groups;
}
/* The page as the reader sees it (after /Rotate), mapped to PDF space.
   W/H: visible size. pt(vx, vy): visible point, top-left origin -> PDF point.

/* ---------- Video: trim & compress ---------- */
function pickMime() {

      <div class="bar" style="padding:0 0 14px"><button class="btn ghost small" data-seta>Start at playhead</button><button class="btn ghost small" data-setb>End at playhead</button></div>
      <label class="f">Resolution<select data-res><option value="0">Keep original</option><option value="1080">1080p</option><option value="720" selected>720p</option><option value="480">480p</option><option value="360">360p</option></select></label>
      <label class="f">File size<select data-br><option value="6000000">Larger, best quality</option><option value="2500000" selected>Balanced</option><option value="1000000">Smallest</option></select></label>
      <label class="check"><input type="checkbox" data-mute> Remove the sound</label>
      <p class="note">Export plays the clip through in real time, so a 2-minute clip takes about 2 minutes. Keep this tab open and visible while it runs.</p>
      <button class="btn wide" data-go disabled>Export video</button><progress max="1" value="0" hidden></progress>
      <p class="status" data-st role="status" aria-live="polite"></p></aside></div><section class="results" data-out hidden></section>`;
  const filesEl = $("[data-files]", root), st = $("[data-st]", root), go = $("[data-go]", root), out = $("[data-out]", root), prog = $("progress", root);
  const inA = $("[data-a]", root), inB = $("[data-b]", root);
  if (pickMime() === null) setStatus(st, "This browser can't export video. Use a recent Chrome, Edge, Firefox or Safari.", "err");
  const reset = () => { file = null; if (url) URL.revokeObjectURL(url); url = null; out.hidden = true; go.disabled = true; setStatus(st, ""); filesEl.innerHTML = dropZone(t); wireDrop($("[data-drop]", filesEl), f => load(f[0])); };
  async function load(f) {

    file = f; if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(f); out.hidden = true;
    filesEl.innerHTML = `<div class="stage-bar"><span class="fi-name">${esc(f.name)}</span><span class="fi-size">${fmtSize(f.size)}</span><label class="btn ghost small"><input type="file" class="sr" accept="${t.exts.map(e => "." + e).join(",")}" data-other>Choose a different file</label></div>
      <div class="vwrap"><video controls playsinline preload="metadata" data-v></video></div>`;
    $("[data-other]", filesEl).onchange = e => e.target.files[0] && load(e.target.files[0]);
    const v = $("[data-v]", filesEl); v.src = url;
    try { await once(v, "loadedmetadata"); } catch (e) { setStatus(st, "Your browser can't play this video format. Try an MP4 or WebM file.", "err"); return; }

  }

    const v = document.createElement("video"); v.src = url; v.playsInline = true; v.preload = "auto";

/* ---------- Video: save a frame ---------- */
function mountFrameGrab(root, t, initial) {
  let file = null, url = null;
  root.innerHTML = head(t) + `<div class="work"><div class="files" data-files></div>
    <aside class="opts"><h2>Options</h2><p class="note">Play or scrub the video to the moment you want, then save it. The image is saved at the video's full resolution.</p>
      <label class="f">Format<select data-fmt><option value="jpg">JPG</option><option value="png">PNG</option></select></label>
      <button class="btn wide" data-go disabled>Save this frame</button><p class="status" data-st role="status" aria-live="polite"></p></aside></div><section class="results" data-out hidden></section>`;
  const filesEl = $("[data-files]", root), st = $("[data-st]", root), go = $("[data-go]", root), out = $("[data-out]", root);
  const reset = () => { if (url) URL.revokeObjectURL(url); url = null; file = null; go.disabled = true; out.hidden = true; filesEl.innerHTML = dropZone(t); wireDrop($("[data-drop]", filesEl), f => load(f[0])); };
  async function load(f) {
    if (!f || !accepts(t, f)) { setStatus(st, "Choose a video file such as MP4, MOV or WebM.", "err"); return; }
    file = f; if (url) URL.revokeObjectURL(url); url = URL.createObjectURL(f);
    filesEl.innerHTML = `<div class="stage-bar"><span class="fi-name">${esc(f.name)}</span><label class="btn ghost small"><input type="file" class="sr" accept="${t.exts.map(e => "." + e).join(",")}" data-other>Choose a different file</label></div><div class="vwrap"><video controls playsinline preload="auto" data-v></video></div>`;
    $("[data-other]", filesEl).onchange = e => e.target.files[0] && load(e.target.files[0]);
    const v = $("[data-v]", filesEl); v.src = url;
    try { await once(v, "loadeddata"); go.disabled = false; setStatus(st, ""); } catch (e) { setStatus(st, "Your browser can't play this video format.", "err"); }
  }
  go.addEventListener("click", async () => {
    const v = $("[data-v]", filesEl); if (!v || !v.videoWidth) return; v.pause();
    const c = document.createElement("canvas"); c.width = v.videoWidth; c.height = v.videoHeight; c.getContext("2d").drawImage(v, 0, 0);
    const png = $("[data-fmt]", root).value === "png";
    try {
      const blob = await canvasBlob(c, png ? "image/png" : "image/jpeg", .93);
      const stamp = fmtTime(v.currentTime).replace(/[:.]/g, "-");
      showResults(out, {files:[{name:baseName(file.name) + "_" + stamp + (png ? ".png" : ".jpg"), blob}], summary:"Frame at " + fmtTime(v.currentTime) + ", " + c.width + "×" + c.height + "."});
    } catch (e) { setStatus(st, e.message, "err"); }

/* ---------- Remote access (coming soon) ---------- */
function mountRemote(root, t) {
  root.innerHTML = head(t) + `<div class="soon">
    <p class="note" style="font-size:1rem">Remote access is being built and isn't available yet. The other tools on this site work today.</p>
    <h2>What it will do</h2>
    <ul><li>Share a short code so someone can see and control your screen, only while you allow it.</li>
    <li>Connect to your own office or home computer while you're away.</li>
    <li>Send files both ways during a session.</li>
    <li>See who is connected at all times, and end the session with one click.</li></ul>
    <h2>Why it needs an app</h2>
    <p>A web page can share your screen but can't let someone else move your mouse or type. So the computer being controlled will run a small app, while the person helping can join from a browser.</p>
    <h2>Staying safe</h2>
    <p>Only give a code to someone you know and trust. Banks, the police and government offices will never ask you to install a remote access app.</p></div>`;
}

/* ---------- Pages ---------- */
let handoff = null;
function renderHome(root, catFilter) {
  const cats = catFilter ? CATS.filter(c => c.id === catFilter) : CATS;
  root.innerHTML = (catFilter ? "" : `<section class="hero"><h1>Drop a file. Pick what to do.</h1>
      <p>Free tools for PDFs, photos, documents, audio and video. Everything runs in your browser, so your files never leave your device.</p>
      <div class="drop" data-drop><div class="drop-txt"><p class="drop-big">Drop any file here to see what you can do with it</p>
        <p class="drop-sub">PDF, Word, photos, contacts (.vcf), spreadsheets, audio and video.</p></div>
        <label class="btn"><input type="file" multiple>Choose files</label></div>
      <div class="picks" data-picks hidden></div></section>`) +
    (catFilter ? `<nav class="crumbs"><a href="#/">All tools</a></nav>` : "") +
    cats.map(c => `<section class="cat" id="cat-${c.id}"><div class="cat-head"><h2>${esc(c.name)}</h2><p>${esc(c.blurb)}</p></div>
      <ul class="tools">${TOOLS.filter(t => t.cat === c.id).map(t => `<li><a href="#/t/${t.id}"><span class="tn">${esc(t.name)}${t.soon ? '<span class="tag">Coming soon</span>' : ""}</span><span class="td">${esc(t.desc)}</span></a></li>`).join("")}</ul></section>`).join("");
  if (catFilter) { root.querySelector(".cat").style.marginTop = "18px"; return; }
  const picks = $("[data-picks]", root);
  wireDrop($("[data-drop]", root), files => {
    const e = extOf(files[0].name);
    const list = TOOLS.filter(t => !t.soon && t.exts && t.exts.includes(e));
    picks.hidden = false;
    if (!list.length) { picks.innerHTML = `<h2>There's no tool for .${esc(e || "this")} files yet.</h2><p class="td">Supported: PDF, DOCX, JPG, PNG, WebP, GIF, BMP, VCF, XLSX, CSV, MP3, WAV, M4A, MP4, MOV, WebM.</p>`; return; }
    const label = files.length > 1 ? files.length + " files" : files[0].name;
    picks.innerHTML = `<h2>What do you want to do with ${esc(label)}?</h2><div class="row">${list.map(t => `<button class="btn ghost" data-t="${t.id}">${esc(t.name)}</button>`).join("")}</div>`;

}
function route() {
  const app = $("#app"); const h = location.hash.replace(/^#\/?/, "");
  const [kind, id] = h.split("/");
  let active = null;
  if (kind === "t" && TOOLS.find(t => t.id === id)) {
    const t = TOOLS.find(t => t.id === id); active = t.cat;
    const initial = handoff; handoff = null;
    (t.custom ? t.custom : mountGeneric)(app, t, initial);
    document.title = t.name + " – Daftarbox";
  } else if (kind === "c" && CATS.find(c => c.id === id)) {
    active = id; renderHome(app, id); document.title = CATS.find(c => c.id === id).name + " – Daftarbox";
  } else { renderHome(app); document.title = "Daftarbox – Free PDF, photo, document, audio and video tools"; }
  $$("#nav a").forEach(a => { if (a.dataset.c === active) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  window.scrollTo(0, 0);
  const h1 = $("h1", app); if (h1) { h1.tabIndex = -1; h1.focus({preventScroll:true}); }
}
$("#nav").innerHTML = CATS.map(c => `<a href="#/c/${c.id}" data-c="${c.id}">${esc(c.name)}</a>`).join("");
window.addEventListener("hashchange", route);
window.addEventListener("dragover", e => e.preventDefault());
window.addEventListener("drop", e => e.preventDefault());
route();
</script>
