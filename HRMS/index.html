<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamaria Group HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-red:#E8412C;
    --brand-red-dark:#c8341f;
    --ink:#2D2D2F;
    --ink-soft:#6b6b6e;
    --bg:#f4f4f5;
    --surface:#ffffff;
    --line:#e4e4e6;
    --ok:#1e8a53;
    --ok-bg:#e7f6ee;
    --warn:#b8862e;
    --warn-bg:#faf1de;
    --bad:#c0392b;
    --bad-bg:#fbeae8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  a{color:var(--brand-red);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}

  /* ---------- Login ---------- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);}
  .login-card{background:var(--surface);border-radius:12px;padding:40px 36px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .login-logo .mark{width:34px;height:34px;border-radius:8px;background:var(--brand-red);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;}
  .login-logo .name{font-weight:700;font-size:16px;}
  .login-logo .name small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;}
  .login-card h1{font-size:18px;margin:18px 0 4px;}
  .login-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-red);outline-offset:-1px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:7px;border:1px solid transparent;font-weight:600;font-size:13.5px;}
  .btn-primary{background:var(--brand-red);color:#fff;}
  .btn-primary:hover{background:var(--brand-red-dark);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{background:var(--bg);}
  .btn-block{width:100%;}
  .err-msg{background:var(--bad-bg);color:var(--bad);padding:9px 11px;border-radius:7px;font-size:13px;margin-bottom:14px;}
  .ok-msg{background:var(--ok-bg);color:var(--ok);padding:9px 11px;border-radius:7px;font-size:13px;margin-bottom:14px;}

  /* ---------- Shell ---------- */
  #app-shell{display:none;min-height:100vh;}
  #app-shell.active{display:flex;}
  #sidebar{width:220px;flex:none;background:var(--ink);color:#fff;display:flex;flex-direction:column;}
  #sidebar .brand{display:flex;align-items:center;gap:10px;padding:18px 16px;border-bottom:1px solid rgba(255,255,255,.08);}
  #sidebar .brand .mark{width:30px;height:30px;border-radius:7px;background:var(--brand-red);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;flex:none;}
  #sidebar .brand .name{font-weight:700;font-size:14px;line-height:1.2;}
  #sidebar .brand .name small{display:block;font-weight:400;font-size:10px;opacity:.6;text-transform:uppercase;letter-spacing:.05em;}
  #nav{flex:1;padding:10px;overflow-y:auto;}
  #nav .nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.07em;opacity:.45;padding:14px 10px 6px;}
  #nav button{display:flex;align-items:center;width:100%;text-align:left;background:transparent;border:none;color:#fff;padding:9px 10px;border-radius:7px;font-size:13.5px;margin-bottom:2px;opacity:.8;}
  #nav button:hover{background:rgba(255,255,255,.08);opacity:1;}
  #nav button.active{background:var(--brand-red);opacity:1;}
  #sidebar .who{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;}
  #sidebar .who .role-pill{display:inline-block;margin-top:4px;font-size:10px;background:rgba(255,255,255,.12);padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;}
  #sidebar .who button{margin-top:10px;width:100%;background:rgba(255,255,255,.08);border:none;color:#fff;padding:7px;border-radius:6px;font-size:12.5px;}

  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;}
  #topbar h2{margin:0;font-size:18px;}
  #content{flex:1;padding:26px;overflow-y:auto;}

  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;}
  .stat-card .stat-label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .stat-value{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;}
  .stat-card .stat-sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .panel-head h3{margin:0;font-size:15px;}
  .panel-body{padding:18px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);background:var(--bg);}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill-pending{background:var(--warn-bg);color:var(--warn);}
  .pill-approved{background:var(--ok-bg);color:var(--ok);}
  .pill-rejected{background:var(--bad-bg);color:var(--bad);}
  .pill-resolved{background:var(--ok-bg);color:var(--ok);}
  .pill-role{background:var(--bg);color:var(--ink-soft);}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .empty-state{padding:30px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:10px;padding:24px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .toast-host{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .toast.error{background:var(--bad);}
  .toast.success{background:var(--ok);}

  .muted{color:var(--ink-soft);}
  .row-actions button{margin-right:6px;}
  .small-btn{padding:5px 10px;font-size:12.5px;border-radius:6px;border:1px solid var(--line);background:#fff;}
  .small-btn.danger{color:var(--bad);border-color:var(--bad-bg);}
  .small-btn.primary{background:var(--brand-red);color:#fff;border-color:var(--brand-red);}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="mark">CG</div>
      <div class="name">Chamaria Group<small>HRMS Portal</small></div>
    </div>
    <h1>Sign in</h1>
    <p class="sub">Use the email and password provided by HR.</p>
    <div id="login-error"></div>
    <form id="login-form">
      <div class="field">
        <label>Email</label>
        <input type="email" id="login-email" required autocomplete="username">
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="login-password" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary btn-block">Sign in</button>
    </form>
  </div>
</div>

<div id="no-profile-screen" style="display:none;min-height:100vh;align-items:center;justify-content:center;flex-direction:column;gap:14px;">
  <div class="login-logo"><div class="mark">CG</div><div class="name">Chamaria Group<small>HRMS Portal</small></div></div>
  <p class="muted" style="max-width:340px;text-align:center;">Your login works, but no employee profile is set up for this account yet. Contact HR to finish provisioning your access.</p>
  <button class="btn btn-ghost" onclick="doSignOut()">Sign out</button>
</div>

<div id="app-shell">
  <div id="sidebar">
    <div class="brand">
      <div class="mark">CG</div>
      <div class="name">Chamaria Group<small>HRMS Portal</small></div>
    </div>
    <div id="nav"></div>
    <div class="who">
      <div id="who-name"></div>
      <span id="who-role" class="role-pill"></span>
      <button onclick="doSignOut()">Sign out</button>
    </div>
  </div>
  <div id="main">
    <div id="topbar"><h2 id="page-title">Dashboard</h2><div id="page-actions"></div></div>
    <div id="content"></div>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast-host" id="toast-host"></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc,
  collection, query, where, orderBy, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0kX55vgd_-rF3MYnr3IsfsPUlft2d2fQ",
  authDomain: "chamariagroup-hrms.firebaseapp.com",
  projectId: "chamariagroup-hrms",
  storageBucket: "chamariagroup-hrms.firebasestorage.app",
  messagingSenderId: "413213870536",
  appId: "1:413213870536:web:f05b25369befe2b23998fd"
};

// TODO(Ravi): fill in your existing EmailJS account details (same account
// already wired for IT Asset Portal ticket alerts) to turn on real emails
// for leave-application / approval-decision notices. Until these are set,
// sendEmail() just logs to the console instead of failing.
const EMAILJS_CONFIG = { serviceId: "", templateId: "", publicKey: "" };
if(EMAILJS_CONFIG.publicKey && window.emailjs) window.emailjs.init(EMAILJS_CONFIG.publicKey);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Secondary app instance used ONLY to create new Firebase Auth users from
// the Employees screen without signing the admin's own session out — the
// well-known workaround for doing user-creation client-side with no Cloud
// Functions (Spark plan has no billing account, so no deployable functions).
const secondaryApp = initializeApp(firebaseConfig, "secondary");
const secondaryAuth = getAuth(secondaryApp);

function sendEmail(templateParams){
  if(!EMAILJS_CONFIG.serviceId || !window.emailjs){
    console.log("[EmailJS not configured — would have sent]", templateParams);
    return;
  }
  window.emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, templateParams, EMAILJS_CONFIG.publicKey)
    .catch(err => console.error("EmailJS send failed", err));
}

// ---------------- state ----------------
const S = {
  user: null,
  me: null,          // employees/{uid} doc data + id
  employeesCache: [],
  companiesCache: [],
  leaveTypesCache: [],
  shiftsCache: [],
  departmentsCache: [],
  designationsCache: [],
  view: "dashboard",
};

const ROLE_LABEL = { employee:"Employee", senior:"Senior", hr_admin:"HR Admin", super_admin:"Super Admin" };

function toast(msg, kind){
  const host = document.getElementById("toast-host");
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

function fmtDate(d){
  if(!d) return "—";
  if(typeof d === "string") return d;
  if(d.toDate) d = d.toDate();
  return new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
}
function daysBetweenInclusive(fromStr, toStr){
  const a = new Date(fromStr), b = new Date(toStr);
  return Math.round((b - a) / 86400000) + 1;
}
function thisYear(){ return new Date().getFullYear(); }

// ---------------- auth ----------------
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errBox = document.getElementById("login-error");
  errBox.innerHTML = "";
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(err){
    errBox.innerHTML = '<div class="err-msg">Sign-in failed — check the email and password.</div>';
  }
});

window.doSignOut = async function(){
  await signOut(auth);
};

function show(id){
  ["login-screen","no-profile-screen","app-shell"].forEach(x=>{
    const el = document.getElementById(x);
    if(x==="app-shell"){ el.classList.toggle("active", x===id); el.style.display = x===id ? "flex" : "none"; }
    else el.style.display = x===id ? "flex" : "none";
  });
}

onAuthStateChanged(auth, async (user) => {
  if(!user){ S.user=null; S.me=null; show("login-screen"); return; }
  S.user = user;
  try{
    const meSnap = await getDoc(doc(db,"employees",user.uid));
    if(!meSnap.exists()){ show("no-profile-screen"); return; }
    S.me = { id: user.uid, ...meSnap.data() };
  }catch(e){
    console.error(e);
    show("no-profile-screen");
    return;
  }
  await preloadCaches();
  show("app-shell");
  document.getElementById("who-name").textContent = S.me.name || S.me.email;
  document.getElementById("who-role").textContent = ROLE_LABEL[S.me.role] || S.me.role;
  renderNav();
  navigateTo("dashboard");
});

async function preloadCaches(){
  const ltSnap = await getDocs(collection(db,"leaveTypes"));
  S.leaveTypesCache = ltSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const coSnap = await getDocs(collection(db,"companies"));
  S.companiesCache = coSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const empSnap = await getDocs(collection(db,"employees"));
  S.employeesCache = empSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const shSnap = await getDocs(collection(db,"shifts"));
  S.shiftsCache = shSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const depSnap = await getDocs(collection(db,"departments"));
  S.departmentsCache = depSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const desSnap = await getDocs(collection(db,"designations"));
  S.designationsCache = desSnap.docs.map(d=>({ id:d.id, ...d.data() }));
}

function companyName(id){ const c = S.companiesCache.find(c=>c.id===id); return c ? c.name : (id||"—"); }
function employeeName(uid){ const e = S.employeesCache.find(e=>e.id===uid); return e ? e.name : uid; }
function isHrOrAbove(){ return S.me && (S.me.role==="hr_admin" || S.me.role==="super_admin"); }
function isSuperAdmin(){ return S.me && S.me.role==="super_admin"; }

// ---------------- nav / shell ----------------
function renderNav(){
  const items = [
    { id:"dashboard", label:"Dashboard", show:true },
    { id:"announcements", label:"Announcements", show:true },
    { id:"my-profile", label:"My Profile", show:true },
    { id:"directory", label:"Directory", show:true },
    { id:"my-leave", label:"My Leave", show:true },
    { id:"my-attendance", label:"My Attendance", show:true },
    { id:"my-travel", label:"Travel", show:true },
    { id:"my-tasks", label:"Tasks", show:true },
    { id:"my-okrs", label:"OKRs", show:true },
    { id:"performance", label:"Performance", show:true },
    { id:"my-time", label:"Time Tracker", show:true },
    { id:"policies", label:"Policies", show:true },
    { id:"my-salary", label:"My Salary", show:true },
    { id:"my-files", label:"My Documents", show:true },
    { id:"regularisation", label:"Regularisation", show:true },
    { id:"requests", label:"Other Requests", show:true },
  ];
  const approverItems = [
    { id:"approvals", label:"Approvals", show: S.me.role==="senior" || isHrOrAbove() },
  ];
  const adminItems = [
    { id:"employees", label:"Employees", show: isHrOrAbove() },
    { id:"departments", label:"Departments", show: isHrOrAbove() },
    { id:"onboarding", label:"Onboarding", show: isHrOrAbove() },
    { id:"offboarding", label:"Offboarding", show: isHrOrAbove() },
    { id:"hr-letters", label:"HR Letters", show: isHrOrAbove() },
    { id:"leave-policy", label:"Leave Policy", show: isHrOrAbove() },
    { id:"holidays", label:"Holiday Calendar", show:true },
    { id:"shifts", label:"Shifts", show: isHrOrAbove() },
    { id:"attendance-import", label:"Attendance Import", show: isHrOrAbove() },
    { id:"companies", label:"Companies", show: isSuperAdmin() },
  ];
  const nav = document.getElementById("nav");
  nav.innerHTML = "";
  function section(label, arr){
    const visible = arr.filter(i=>i.show);
    if(!visible.length) return;
    const h = document.createElement("div"); h.className="nav-section"; h.textContent=label;
    nav.appendChild(h);
    visible.forEach(i=>{
      const b = document.createElement("button");
      b.textContent = i.label; b.dataset.view = i.id;
      b.onclick = ()=>navigateTo(i.id);
      nav.appendChild(b);
    });
  }
  section("Self service", items);
  section("Approvals", approverItems);
  section("Administration", adminItems);
}
function updateNavActive(){
  document.querySelectorAll("#nav button").forEach(b=>{
    b.classList.toggle("active", b.dataset.view===S.view);
  });
}

const VIEW_TITLES = {
  "dashboard":"Dashboard", "my-leave":"My Leave", "my-attendance":"My Attendance",
  "my-salary":"My Salary Structure", "regularisation":"Attendance Regularisation",
  "requests":"Other Requests", "approvals":"Approvals", "employees":"Employees",
  "leave-policy":"Leave Policy", "holidays":"Holiday Calendar",
  "attendance-import":"Attendance Import", "companies":"Companies",
  "announcements":"Announcements", "directory":"Employee Directory",
  "my-travel":"Travel", "my-tasks":"Tasks", "my-okrs":"OKRs",
  "performance":"Performance", "my-files":"My Documents",
  "onboarding":"Onboarding", "offboarding":"Offboarding",
  "hr-letters":"HR Letters", "shifts":"Shifts",
  "my-time":"Time Tracker", "policies":"Policies",
  "my-profile":"My Profile", "departments":"Departments & Designations",
};

async function navigateTo(view){
  S.view = view;
  updateNavActive();
  document.getElementById("page-title").textContent = VIEW_TITLES[view] || view;
  document.getElementById("page-actions").innerHTML = "";
  const content = document.getElementById("content");
  content.innerHTML = '<div class="empty-state">Loading…</div>';
  try{
    const html = await RENDERERS[view]();
    content.innerHTML = html;
  }catch(e){
    console.error(e);
    content.innerHTML = '<div class="empty-state">Something went wrong loading this page. Check the console for details.</div>';
  }
}
window.navigateTo = navigateTo;

// ---------------- modal helper ----------------
function openModal(title, bodyHtml){
  document.getElementById("modal-root").innerHTML = `
    <div class="modal-backdrop" onclick="if(event.target===this) closeModal()">
      <div class="modal">
        <h3>${title}</h3>
        ${bodyHtml}
      </div>
    </div>`;
}
window.closeModal = function(){ document.getElementById("modal-root").innerHTML = ""; };

// ==================== DASHBOARD ====================
async function renderDashboard(){
  if(isHrOrAbove()){
    const pendingLeaveSnap = await getDocs(query(collection(db,"leaveRequests"), where("status","==","pending")));
    const empCount = S.employeesCache.filter(e=>e.status!=="inactive").length;
    return `
      <div class="grid grid-4">
        <div class="card stat-card"><div class="stat-label">Employees</div><div class="stat-value">${empCount}</div><div class="stat-sub">across ${S.companiesCache.length} companies</div></div>
        <div class="card stat-card"><div class="stat-label">Pending leave requests</div><div class="stat-value">${pendingLeaveSnap.size}</div></div>
        <div class="card stat-card"><div class="stat-label">Leave types configured</div><div class="stat-value">${S.leaveTypesCache.length}</div></div>
        <div class="card stat-card"><div class="stat-label">Your role</div><div class="stat-value" style="font-size:18px;">${ROLE_LABEL[S.me.role]}</div></div>
      </div>`;
  }
  const balSnap = await getDocs(collection(db,"employees",S.me.id,"leaveBalances"));
  const bals = balSnap.docs.map(d=>d.data()).filter(b=>b.year===thisYear());
  return `
    <div class="grid grid-3">
      ${bals.length ? bals.map(b=>`
        <div class="card stat-card">
          <div class="stat-label">${b.typeCode} balance</div>
          <div class="stat-value">${(b.opening+b.accrued-b.used)}</div>
          <div class="stat-sub">of ${b.opening+b.accrued} for ${b.year}</div>
        </div>`).join("") : '<div class="card muted">No leave applied yet this year — balances appear once you apply.</div>'}
    </div>`;
}

// ==================== MY LEAVE ====================
async function renderMyLeave(){
  document.getElementById("page-actions").innerHTML =
    '<button class="btn btn-primary" onclick="openApplyLeaveModal()">Apply for leave</button>';
  const balSnap = await getDocs(collection(db,"employees",S.me.id,"leaveBalances"));
  const bals = balSnap.docs.map(d=>d.data()).filter(b=>b.year===thisYear());

window.submitApplyLeave = async function(){
  const typeCode = document.getElementById("al-type").value;
  const from = document.getElementById("al-from").value;
  const to = document.getElementById("al-to").value;
  const reason = document.getElementById("al-reason").value.trim();
  if(!typeCode || !from || !to){ toast("Fill in leave type and dates", "error"); return; }
  const days = daysBetweenInclusive(from, to);
  if(days <= 0){ toast("'To' date must be on or after 'from' date", "error"); return; }
  if(!S.me.reportsTo){ toast("You have no reporting Senior set — ask HR to fix this first", "error"); return; }

  const year = thisYear();
  const balRef = doc(db, "employees", S.me.id, "leaveBalances", `${typeCode}_${year}`);
  const balSnap = await getDoc(balRef);
  const leaveType = S.leaveTypesCache.find(t=>t.id===typeCode);
  if(!balSnap.exists()){
    await setDoc(balRef, { typeCode, year, opening: leaveType ? leaveType.annualQuota : 0, accrued:0, used:0 });
  }
  const bal = (await getDoc(balRef)).data();
  const remaining = bal.opening + bal.accrued - bal.used;
  if(days > remaining){
    toast(`Insufficient balance — only ${remaining} ${typeCode} day(s) left`, "error");
    return;
  }

  await addDoc(collection(db,"leaveRequests"), {
    employeeId: S.me.id, typeCode, fromDate: from, toDate: to, days, reason,
    status:"pending", approverId: S.me.reportsTo, approverComment:"",
    createdAt: serverTimestamp()
  });
  sendEmail({
    to_email: employeeEmail(S.me.reportsTo), employee_name: S.me.name,
    leave_type: typeCode, from_date: from, to_date: to, days, reason
  });
  toast("Leave request submitted", "success");
  closeModal();
  navigateTo("my-leave");
};

window.submitAttendanceImport = async function(){
  const raw = document.getElementById("att-csv").value.trim();
  const resultBox = document.getElementById("att-import-result");
  if(!raw){ toast("Paste some CSV first", "error"); return; }
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  const header = lines[0].split(",").map(h=>h.trim());
  let ok=0, fail=0; const failedEmails=[];
  for(const line of lines.slice(1)){
    const cols = line.split(",").map(c=>c.trim());
    const row = {}; header.forEach((h,i)=>row[h]=cols[i]);
    if(!row.email || !row.date){ fail++; continue; }
    const match = S.employeesCache.find(e=>e.email.toLowerCase()===row.email.toLowerCase());
    if(!match){ fail++; failedEmails.push(row.email); continue; }
    try{
      await setDoc(doc(db,"employees",match.id,"attendance",row.date), {
        date: row.date, inTime: row.inTime||"", outTime: row.outTime||"", status: row.status||"present", source:"manual"
      });
      ok++;
    }catch(e){ fail++; }
  }
  resultBox.innerHTML = `<div class="${fail? 'err-msg':'ok-msg'}">Imported ${ok} row(s), ${fail} failed${failedEmails.length? ' (unmatched: '+failedEmails.join(", ")+')':''}.</div>`;
};

function computeYearsMonths(fromISO, toISO){
  if(!fromISO) return null;
  const from = new Date(fromISO);
  const to = toISO ? new Date(toISO) : new Date();
  let months = (to.getFullYear()-from.getFullYear())*12 + (to.getMonth()-from.getMonth());
  if(to.getDate() < from.getDate()) months--;
  if(months < 0) return null;
  const years = Math.floor(months/12);
  const rem = months%12;
  return `${years} year(s) ${rem} month(s)`;
}
function computeAge(dob){ return computeYearsMonths(dob); }

  await signOut(secondaryAuth); // secondary session no longer needed; primary (admin) session is untouched
  const data = { name, email, phone: phone||"", companyId, role, reportsTo: reportsTo||null, status:"active", doj: doj || new Date().toISOString().slice(0,10) };
  await setDoc(doc(db,"employees",uid), data);
  S.employeesCache.push({ id:uid, ...data });
  return uid;
}

    <div class="field"><label>Company (payroll) — applies to this whole batch</label><select id="bi-company">${companyOptions()}</select></div>
    <div class="field"><label>Role — applies to this whole batch</label><select id="bi-role">${roleOptions()}</select></div>

Ravi Kumar,ravi.kumar@chamariagroup.com,,,,"></textarea></div>
    <div class="actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitBulkImport()">Import</button></div>
    <div id="bi-result" style="margin-top:14px;"></div>
  `);
};

window.submitBulkImport = async function(){
  const companyId = document.getElementById("bi-company").value;
  const role = document.getElementById("bi-role").value;
  const fallbackReportsTo = document.getElementById("bi-reportsto").value || null;
  const raw = document.getElementById("bi-csv").value.trim();
  const resultBox = document.getElementById("bi-result");
  if(!raw){ toast("Paste at least one row", "error"); return; }
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  const results = [];
  const createdForLinking = []; // { uid, managerName, shiftName }
  resultBox.innerHTML = `<div class="muted">Importing 0 / ${lines.length}…</div>`;
  for(let i=0; i<lines.length; i++){
    const [name, email, phone, doj, managerName, shiftName] = lines[i].split(",").map(c=>(c||"").trim());
    resultBox.innerHTML = `<div class="muted">Importing ${i+1} / ${lines.length}…</div>`;
    if(!name || !email){ results.push({ name: name||"(blank)", email: email||"", status:"failed", note:"missing name or email" }); continue; }
    if(S.employeesCache.find(e=>e.email.toLowerCase()===email.toLowerCase())){
      results.push({ name, email, status:"skipped", note:"already exists" }); continue;
    }
    const password = genTempPassword();
    try{
      const uid = await createOneEmployee({ name, email, phone, password, companyId, role, reportsTo: fallbackReportsTo, doj });
      results.push({ name, email, status:"created", note: password });
      if(managerName || shiftName) createdForLinking.push({ uid, managerName, shiftName });
    }catch(err){
      results.push({ name, email, status:"failed", note: err.message || "error" });
    }
  }
  // Second pass: resolve manager/shift names now that every row in this batch exists.
  let linked = 0, linkFailed = [];
  for(const row of createdForLinking){
    const patch = {};
    if(row.managerName){
      const mgr = findEmployeeByName(row.managerName);
      if(mgr) patch.reportsTo = mgr.id;
      else linkFailed.push(`${row.managerName} (manager, not found)`);
    }
    if(row.shiftName){
      const sh = S.shiftsCache.find(s=>s.name.trim().toLowerCase()===row.shiftName.trim().toLowerCase());
      if(sh) patch.shiftId = sh.id;
      else linkFailed.push(`${row.shiftName} (shift, not found)`);
    }
    if(Object.keys(patch).length){
      await updateDoc(doc(db,"employees",row.uid), patch);
      const idx = S.employeesCache.findIndex(e=>e.id===row.uid);
      if(idx>-1) S.employeesCache[idx] = { ...S.employeesCache[idx], ...patch };
      linked++;
    }
  }
  const ok = results.filter(r=>r.status==="created").length;
  resultBox.innerHTML = `
    <div class="${ok===results.length ? 'ok-msg':'err-msg'}">Created ${ok} of ${results.length}. Linked manager/shift on ${linked} row(s).${linkFailed.length?' Could not match: '+linkFailed.join(", "):''}</div>
    <div class="table-wrap" style="margin-top:10px;max-height:220px;overflow-y:auto;">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Temp password / note</th></tr></thead>
        <tbody>
          ${results.map(r=>`<tr><td>${r.name}</td><td>${r.email}</td><td><span class="pill pill-${r.status==='created'?'approved':r.status==='skipped'?'pending':'rejected'}">${r.status}</span></td><td class="muted">${r.note}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>
    <p class="muted" style="font-size:12px;">Save the temporary passwords now — they aren't shown again. Share them with each employee securely.</p>
  `;
  renderNav();
};

// ==================== OKRs ====================
function okrTable(list, showOwner){
  return `<table><thead><tr>${showOwner?"<th>Employee</th>":""}<th>Period</th><th>Objective</th><th>Key results</th><th>Progress</th>${showOwner?"":"<th></th>"}</tr></thead>
  <tbody>${list.length?list.map(o=>{
    const krs = o.keyResults||[];
    const avg = krs.length ? Math.round(krs.reduce((s,k)=>s+(k.progress||0),0)/krs.length) : 0;
    return `<tr>${showOwner?`<td>${employeeName(o.employeeId)}</td>`:""}<td>${o.period}</td><td>${o.objective}</td>
    <td class="muted">${krs.map(k=>`${k.text} (${k.progress||0}%)`).join("<br>")}</td>
    <td><b>${avg}%</b></td>${showOwner?"":`<td><button class="small-btn" onclick="openOkrProgressModal('${o.id}')">Update</button></td>`}</tr>`;
  }).join(""):`<tr><td colspan="${showOwner?4:5}" class="empty-state">None yet.</td></tr>`}</tbody></table>`;
}
window.openOkrProgressModal = async function(id){
  const snap = await getDoc(doc(db,"okrs",id));
  if(!snap.exists()) return;
  const o = snap.data();
  const krs = o.keyResults||[];
  openModal("Update progress — " + o.objective, `
    ${krs.map((k,i)=>`
      <div class="field">
        <label>${k.text}</label>
        <input type="range" id="krp-${i}" min="0" max="100" step="5" value="${k.progress||0}" oninput="document.getElementById('krp-val-${i}').textContent=this.value+'%'" style="width:100%;">
        <span id="krp-val-${i}" class="muted" style="font-size:12px;">${k.progress||0}%</span>
      </div>`).join("") || '<p class="muted">No key results were added for this objective.</p>'}
    <div class="actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitOkrProgress('${id}',${krs.length})">Save</button></div>
  `);
};
window.submitOkrProgress = async function(id, count){
  const snap = await getDoc(doc(db,"okrs",id));
  const krs = snap.data().keyResults||[];
  for(let i=0;i<count;i++){
    krs[i].progress = Number(document.getElementById(`krp-${i}`).value)||0;
  }
  await updateDoc(doc(db,"okrs",id), { keyResults: krs });
  toast("Progress updated","success"); closeModal(); navigateTo("my-okrs");
};

// ==================== TIME TRACKER ====================
async function renderMyTime(){
  document.getElementById("page-actions").innerHTML = '<button class="btn btn-primary" onclick="openTimeLogModal()">Log time</button>';
  const mineSnap = await getDocs(query(collection(db,"timeLogs"), where("employeeId","==",S.me.id)));
  const mine = mineSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
  const totalHrs = mine.reduce((s,t)=>s+(Number(t.hours)||0),0);
  let teamHtml = "";
  if(S.me.role==="senior" || isHrOrAbove()){
    const teamSnap = isHrOrAbove()
      ? await getDocs(collection(db,"timeLogs"))
      : await getDocs(query(collection(db,"timeLogs"), where("employeeId","in",S.employeesCache.filter(e=>e.reportsTo===S.me.id).map(e=>e.id).slice(0,10) || ["_none_"])));
    const team = teamSnap.docs.map(d=>({id:d.id,...d.data()})).filter(t=>t.employeeId!==S.me.id).sort((a,b)=>(b.date||"").localeCompare(a.date||""));
    teamHtml = `<div class="panel" style="margin-top:20px;"><div class="panel-head"><h3>Team time logs</h3></div>
      <div class="table-wrap"><table><thead><tr><th>Employee</th><th>Date</th><th>Hours</th><th>Task</th><th>Notes</th></tr></thead>
      <tbody>${team.length?team.map(t=>`<tr><td>${employeeName(t.employeeId)}</td><td>${fmtDate(t.date)}</td><td>${t.hours}</td><td class="muted">${t.taskTitle||"—"}</td><td class="muted">${t.notes||"—"}</td></tr>`).join(""):'<tr><td colspan="5" class="empty-state">No entries yet.</td></tr>'}</tbody></table></div></div>`;
  }
  return `<div class="panel"><div class="panel-head"><h3>My time log</h3><span class="muted" style="font-size:12px;">Total logged: ${totalHrs}h</span></div>
    <div class="table-wrap"><table><thead><tr><th>Date</th><th>Hours</th><th>Task</th><th>Notes</th><th></th></tr></thead>
    <tbody>${mine.length?mine.map(t=>`<tr><td>${fmtDate(t.date)}</td><td>${t.hours}</td><td class="muted">${t.taskTitle||"—"}</td><td class="muted">${t.notes||"—"}</td><td><button class="small-btn danger" onclick="deleteTimeLog('${t.id}')">Delete</button></td></tr>`).join(""):'<tr><td colspan="5" class="empty-state">No time logged yet.</td></tr>'}</tbody></table></div></div>${teamHtml}`;
}
window.openTimeLogModal = async function(){
  const myTasksSnap = await getDocs(query(collection(db,"tasks"), where("assignedTo","==",S.me.id)));
  const myTasks = myTasksSnap.docs.map(d=>({id:d.id,...d.data()}));
  openModal("Log time", `
    <div class="field"><label>Date</label><input type="date" id="tl-date" value="${new Date().toISOString().slice(0,10)}"></div>
    <div class="field"><label>Hours</label><input type="number" id="tl-hours" step="0.5" min="0" max="24"></div>
    <div class="field"><label>Related task (optional)</label><select id="tl-task"><option value="">— none —</option>${myTasks.map(t=>`<option value="${t.id}" data-title="${t.title}">${t.title}</option>`).join("")}</select></div>
    <div class="field"><label>Notes</label><textarea id="tl-notes" rows="2"></textarea></div>
    <div class="actions"><button class="btn btn-ghost" onclick="closeModal()">Cancel</button><button class="btn btn-primary" onclick="submitTimeLog()">Save</button></div>
  `);
};
window.submitTimeLog = async function(){
  const date = document.getElementById("tl-date").value;
  const hours = Number(document.getElementById("tl-hours").value)||0;
  const taskSel = document.getElementById("tl-task");
  const taskId = taskSel.value || null;
  const taskTitle = taskId ? taskSel.selectedOptions[0].dataset.title : "";
  const notes = document.getElementById("tl-notes").value.trim();
  if(!date || hours<=0){ toast("Pick a date and enter hours greater than 0","error"); return; }
  await addDoc(collection(db,"timeLogs"), { employeeId:S.me.id, date, hours, taskId, taskTitle, notes, createdAt: serverTimestamp() });
  toast("Time logged","success"); closeModal(); navigateTo("my-time");
};
window.deleteTimeLog = async function(id){
  if(!confirm("Delete this entry?")) return;
  await deleteDoc(doc(db,"timeLogs",id));
  navigateTo("my-time");
};

window.submitMyProfile = async function(){
  const patch = {
    nickName: document.getElementById("mp-nick").value.trim(),
    phone: document.getElementById("mp-phone").value.trim(),
    dob: document.getElementById("mp-dob").value || null,
    gender: document.getElementById("mp-gender").value,
    maritalStatus: document.getElementById("mp-marital").value,
    priorExperience: document.getElementById("mp-priorexp").value.trim(),
    coreSkills: document.getElementById("mp-skills").value.trim(),
    personalEmail: document.getElementById("mp-pemail").value.trim(),
    pan: document.getElementById("mp-pan").value.trim(),
    uan: document.getElementById("mp-uan").value.trim(),
    insurancePolicyNumber: document.getElementById("mp-insno").value.trim(),
    insuranceFrom: document.getElementById("mp-insfrom").value,
    presentAddress: document.getElementById("mp-present").value.trim(),
    permanentAddress: document.getElementById("mp-permanent").value.trim(),
    aboutMe: document.getElementById("mp-about").value.trim(),
  };
  await updateDoc(doc(db,"employees",S.me.id), patch);
  S.me = { ...S.me, ...patch };
  const meIdx = S.employeesCache.findIndex(e=>e.id===S.me.id);
  if(meIdx > -1) S.employeesCache[meIdx] = { ...S.employeesCache[meIdx], ...patch };
  toast("Profile updated","success");
  navigateTo("my-profile");
};
