<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chamaria Group HRMS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --brand-red:#E8412C;
    --brand-red-dark:#c8341f;
    --ink:#2D2D2F;
    --ink-soft:#6b6b6e;
    --bg:#f4f4f5;
    --surface:#ffffff;
    --line:#e4e4e6;
    --ok:#1e8a53;
    --ok-bg:#e7f6ee;
    --warn:#b8862e;
    --warn-bg:#faf1de;
    --bad:#c0392b;
    --bad-bg:#fbeae8;
  }
  *{box-sizing:border-box;}
  body{margin:0;font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px;}
  a{color:var(--brand-red);}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;font-size:14px;}

  /* ---------- Login ---------- */
  #login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--ink);}
  .login-card{background:var(--surface);border-radius:12px;padding:40px 36px;width:340px;box-shadow:0 20px 60px rgba(0,0,0,.35);}
  .login-logo{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .login-logo .brand-logo{width:38px;height:38px;flex:none;}
  .login-logo .name{font-weight:700;font-size:16px;}
  .login-logo .name small{display:block;font-weight:400;font-size:11px;color:var(--ink-soft);letter-spacing:.04em;text-transform:uppercase;}
  .login-card h1{font-size:18px;margin:18px 0 4px;}
  .login-card p.sub{color:var(--ink-soft);font-size:13px;margin:0 0 20px;}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ink-soft);margin-bottom:5px;}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;background:#fff;color:var(--ink);}
  .field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-red);outline-offset:-1px;}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:7px;border:1px solid transparent;font-weight:600;font-size:13.5px;}
  .btn-primary{background:var(--brand-red);color:#fff;}
  .btn-primary:hover{background:var(--brand-red-dark);}
  .btn-ghost{background:transparent;border-color:var(--line);color:var(--ink);}
  .btn-ghost:hover{background:var(--bg);}
  .btn-block{width:100%;}
  .err-msg{background:var(--bad-bg);color:var(--bad);padding:9px 11px;border-radius:7px;font-size:13px;margin-bottom:14px;}
  .ok-msg{background:var(--ok-bg);color:var(--ok);padding:9px 11px;border-radius:7px;font-size:13px;margin-bottom:14px;}

  /* ---------- Shell ---------- */
  #app-shell{display:none;min-height:100vh;}
  #app-shell.active{display:flex;}
  #sidebar{width:220px;flex:none;background:var(--ink);color:#fff;display:flex;flex-direction:column;}
  #sidebar .brand{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:22px 16px 18px;border-bottom:1px solid rgba(255,255,255,.08);}
  #sidebar .brand .brand-logo{width:64px;height:64px;flex:none;margin-bottom:4px;}
  #sidebar .brand .brand-name{font-weight:800;font-size:15px;letter-spacing:.01em;}
  #sidebar .brand .brand-name .grp{font-weight:400;opacity:.7;margin-left:3px;}
  #sidebar .brand .brand-sub{display:flex;align-items:center;gap:5px;font-size:10.5px;opacity:.65;text-transform:uppercase;letter-spacing:.06em;margin-top:2px;}
  #sidebar .brand .brand-sub svg{width:13px;height:13px;flex:none;}
  #nav{flex:1;padding:10px;overflow-y:auto;}
  #nav .nav-section{font-size:10px;text-transform:uppercase;letter-spacing:.07em;opacity:.45;padding:14px 10px 6px;}
  #nav button{display:flex;align-items:center;width:100%;text-align:left;background:transparent;border:none;color:#fff;padding:9px 10px;border-radius:7px;font-size:13.5px;margin-bottom:2px;opacity:.8;}
  #nav button:hover{background:rgba(255,255,255,.08);opacity:1;}
  #nav button.active{background:var(--brand-red);opacity:1;}
  #nav .nav-mode-toggle{display:flex;gap:4px;background:rgba(255,255,255,.08);border-radius:8px;padding:4px;margin-bottom:6px;}
  #nav .nav-mode-toggle button{flex:1;text-align:center;justify-content:center;margin-bottom:0;font-weight:600;font-size:12px;}
  #nav .nav-quicklinks{display:flex;flex-direction:column;gap:4px;background:rgba(255,255,255,.06);border-radius:8px;padding:5px;margin:2px 0 10px;}
  #nav .nav-quicklinks button{margin-bottom:0;justify-content:center;text-align:center;font-size:12px;font-weight:600;border-radius:6px;}
  #nav .nav-quicklinks button.active{background:var(--brand-red);}
  #sidebar .who{padding:14px 16px;border-top:1px solid rgba(255,255,255,.08);font-size:12.5px;}
  #sidebar .who .role-pill{display:inline-block;margin-top:4px;font-size:10px;background:rgba(255,255,255,.12);padding:2px 7px;border-radius:20px;text-transform:uppercase;letter-spacing:.04em;}
  #sidebar .who button{margin-top:10px;width:100%;background:rgba(255,255,255,.08);border:none;color:#fff;padding:7px;border-radius:6px;font-size:12.5px;}

  #main{flex:1;display:flex;flex-direction:column;min-width:0;}
  #topbar{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;justify-content:space-between;}
  #topbar h2{margin:0;font-size:18px;}
  #content{flex:1;padding:26px;overflow-y:auto;}

  .grid{display:grid;gap:16px;}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  @media (max-width:1000px){.grid-4{grid-template-columns:repeat(2,1fr);} .grid-3{grid-template-columns:repeat(2,1fr);}}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;}
  .stat-card .stat-label{font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.04em;}
  .stat-card .stat-value{font-size:26px;font-weight:700;margin-top:6px;font-variant-numeric:tabular-nums;}
  .stat-card .stat-sub{font-size:12px;color:var(--ink-soft);margin-top:4px;}

  .panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .panel-head{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;}
  .panel-head h3{margin:0;font-size:15px;}
  .panel-body{padding:18px;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th,td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);}
  th{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);background:var(--bg);}
  tr:last-child td{border-bottom:none;}
  .table-wrap{overflow-x:auto;}

  .pill{display:inline-block;padding:2px 9px;border-radius:20px;font-size:11.5px;font-weight:600;}
  .pill-pending{background:var(--warn-bg);color:var(--warn);}
  .pill-approved{background:var(--ok-bg);color:var(--ok);}
  .pill-rejected{background:var(--bad-bg);color:var(--bad);}
  .pill-resolved{background:var(--ok-bg);color:var(--ok);}
  .pill-role{background:var(--bg);color:var(--ink-soft);}

  .toolbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap;align-items:center;}
  .empty-state{padding:30px;text-align:center;color:var(--ink-soft);font-size:13.5px;}

  /* Modal */
  .modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;z-index:50;}
  .modal{background:#fff;border-radius:10px;padding:24px;width:420px;max-width:92vw;max-height:88vh;overflow-y:auto;}
  .modal h3{margin:0 0 16px;font-size:16px;}
  .modal .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px;}

  .toast-host{position:fixed;bottom:20px;right:20px;z-index:80;display:flex;flex-direction:column;gap:8px;}
  .toast{background:var(--ink);color:#fff;padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);}
  .toast.error{background:var(--bad);}
  .toast.success{background:var(--ok);}

  .muted{color:var(--ink-soft);}
  .row-actions button{margin-right:6px;}
  .small-btn{padding:5px 10px;font-size:12.5px;border-radius:6px;border:1px solid var(--line);background:#fff;}
  .small-btn.danger{color:var(--bad);border-color:var(--bad-bg);}
  .small-btn.primary{background:var(--brand-red);color:#fff;border-color:var(--brand-red);}
</style>
</head>
<body>

<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <svg class="brand-logo" viewBox="0 0 106 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 64.2 68.4 A 32 32 0 1 1 64.2 31.6" fill="none" stroke="#E8412C" stroke-width="13" stroke-linecap="round"/>
        <path d="M 41.8 31.6 A 32 32 0 1 1 41.8 68.4" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
        <rect x="41.8" y="62" width="30" height="13" fill="currentColor"/>
      </svg>
      <div class="name">Chamaria Group<small>HRMS Portal</small></div>

  <div class="login-logo">
    <svg class="brand-logo" viewBox="0 0 106 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M 64.2 68.4 A 32 32 0 1 1 64.2 31.6" fill="none" stroke="#E8412C" stroke-width="13" stroke-linecap="round"/>
      <path d="M 41.8 31.6 A 32 32 0 1 1 41.8 68.4" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
      <rect x="54" y="43.5" width="18" height="13" fill="currentColor"/>
    </svg>
    <div class="name">Chamaria Group<small>HRMS Portal</small></div>
  </div>
  <p class="muted" style="max-width:340px;text-align:center;">Your login works, but no employee profile is set up for this account yet. Contact HR to finish provisioning your access.</p>
  <button class="btn btn-ghost" onclick="doSignOut()">Sign out</button>
</div>

<div id="app-shell">
  <div id="sidebar">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 106 100" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <path d="M 64.2 68.4 A 32 32 0 1 1 64.2 31.6" fill="none" stroke="#E8412C" stroke-width="13" stroke-linecap="round"/>
        <path d="M 41.8 31.6 A 32 32 0 1 1 41.8 68.4" fill="none" stroke="currentColor" stroke-width="13" stroke-linecap="round"/>
        <rect x="41.8" y="62" width="30" height="13" fill="currentColor"/>
      </svg>
      <div class="brand-name">CHAMARIA<span class="grp">GROUP</span></div>
      <div class="brand-sub">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="M5 16c0-2 2-3 4-3s4 1 4 3"/><path d="M14 9h5M14 13h5"/></svg>
        HRMS Portal
      </div>
    </div>
    <div id="nav"></div>
    <div class="who">
      <div id="who-name"></div>
      <span id="who-role" class="role-pill"></span>
      <button onclick="doSignOut()">Sign out</button>
    </div>
  </div>
  <div id="main">
    <div id="topbar"><h2 id="page-title">Dashboard</h2><div id="page-actions"></div></div>
    <div id="content"></div>
  </div>
</div>

<div id="modal-root"></div>
<div class="toast-host" id="toast-host"></div>

<script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, addDoc, deleteDoc,
  collection, query, where, orderBy, getDocs, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0kX55vgd_-rF3MYnr3IsfsPUlft2d2fQ",
  authDomain: "chamariagroup-hrms.firebaseapp.com",
  projectId: "chamariagroup-hrms",
  storageBucket: "chamariagroup-hrms.firebasestorage.app",
  messagingSenderId: "413213870536",
  appId: "1:413213870536:web:f05b25369befe2b23998fd"
};

// TODO(Ravi): fill in your existing EmailJS account details (same account
// already wired for IT Asset Portal ticket alerts) to turn on real emails
// for leave-application / approval-decision notices. Until these are set,
// sendEmail() just logs to the console instead of failing.
const EMAILJS_CONFIG = { serviceId: "", templateId: "", publicKey: "" };
if(EMAILJS_CONFIG.publicKey && window.emailjs) window.emailjs.init(EMAILJS_CONFIG.publicKey);

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Secondary app instance used ONLY to create new Firebase Auth users from
// the Employees screen without signing the admin's own session out — the
// well-known workaround for doing user-creation client-side with no Cloud
// Functions (Spark plan has no billing account, so no deployable functions).
const secondaryApp = initializeApp(firebaseConfig, "secondary");
const secondaryAuth = getAuth(secondaryApp);

function sendEmail(templateParams){
  if(!EMAILJS_CONFIG.serviceId || !window.emailjs){
    console.log("[EmailJS not configured — would have sent]", templateParams);
    return;
  }
  window.emailjs.send(EMAILJS_CONFIG.serviceId, EMAILJS_CONFIG.templateId, templateParams, EMAILJS_CONFIG.publicKey)
    .catch(err => console.error("EmailJS send failed", err));
}

// ---------------- state ----------------
const S = {
  user: null,
  me: null,          // employees/{uid} doc data + id
  employeesCache: [],
  companiesCache: [],
  leaveTypesCache: [],
  shiftsCache: [],
  departmentsCache: [],
  designationsCache: [],
  attendanceRecordsCache: [],
  view: "dashboard",
  navMode: "user",
};

const ROLE_LABEL = { employee:"Employee", senior:"Senior", hr_admin:"HR Admin", super_admin:"Super Admin" };

function toast(msg, kind){
  const host = document.getElementById("toast-host");
  const el = document.createElement("div");
  el.className = "toast" + (kind ? " " + kind : "");
  el.textContent = msg;
  host.appendChild(el);
  setTimeout(()=>el.remove(), 4000);
}

function fmtDate(d){
  if(!d) return "—";
  if(typeof d === "string") return d;
  if(d.toDate) d = d.toDate();
  return new Date(d).toLocaleDateString("en-IN", { day:"2-digit", month:"short", year:"numeric" });
}
function thisYear(){ return new Date().getFullYear(); }
function escapeHtml(s){
  return String(s==null?"":s).replace(/[&<>"']/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}
function fileToDataUri(file, maxBytes){
  maxBytes = maxBytes || 900000;
  return new Promise((resolve, reject) => {
    if(file.size > maxBytes){ reject(new Error(`File too large (max ${Math.round(maxBytes/1024)}KB)`)); return; }
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

// ---------------- auth ----------------
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const errBox = document.getElementById("login-error");
  errBox.innerHTML = "";
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(err){
    errBox.innerHTML = '<div class="err-msg">Sign-in failed — check the email and password.</div>';
  }
});

window.doSignOut = async function(){
  await signOut(auth);
};

function show(id){
  ["login-screen","no-profile-screen","app-shell"].forEach(x=>{
    const el = document.getElementById(x);
    if(x==="app-shell"){ el.classList.toggle("active", x===id); el.style.display = x===id ? "flex" : "none"; }
    else el.style.display = x===id ? "flex" : "none";
  });
}

onAuthStateChanged(auth, async (user) => {
  if(!user){ S.user=null; S.me=null; show("login-screen"); return; }
  S.user = user;
  try{
    const meSnap = await getDoc(doc(db,"employees",user.uid));
    if(!meSnap.exists()){ show("no-profile-screen"); return; }
    S.me = { id: user.uid, ...meSnap.data() };
  }catch(e){
    console.error(e);
    show("no-profile-screen");
    return;
  }
  await preloadCaches();
  show("app-shell");
  document.getElementById("who-name").textContent = S.me.name || S.me.email;
  document.getElementById("who-role").textContent = ROLE_LABEL[S.me.role] || S.me.role;
  renderNav();
  navigateTo("dashboard");
});

async function preloadCaches(){
  const ltSnap = await getDocs(collection(db,"leaveTypes"));
  S.leaveTypesCache = ltSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const coSnap = await getDocs(collection(db,"companies"));
  S.companiesCache = coSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const empSnap = await getDocs(collection(db,"employees"));
  S.employeesCache = empSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const shSnap = await getDocs(collection(db,"shifts"));
  S.shiftsCache = shSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const depSnap = await getDocs(collection(db,"departments"));
  S.departmentsCache = depSnap.docs.map(d=>({ id:d.id, ...d.data() }));
  const desSnap = await getDocs(collection(db,"designations"));
  S.designationsCache = desSnap.docs.map(d=>({ id:d.id, ...d.data() }));
}

function companyName(id){ const c = S.companiesCache.find(c=>c.id===id); return c ? c.name : (id||"—"); }
function companyById(id){ return S.companiesCache.find(c=>c.id===id) || { name: id||"—" }; }
function companyLetterheadHtml(company){
  const details = [company.address, company.phone, company.email].filter(Boolean).join(" · ");
  return `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:6px;"><div style="width:32px;height:32px;border-radius:7px;background:#E8412C;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;">CG</div><b>${company.name}</b></div>
    <div style="font-size:11px;color:#666;margin-bottom:24px;min-height:14px;">${details}</div>
  `;
}
function employeeName(uid){ const e = S.employeesCache.find(e=>e.id===uid); return e ? e.name : uid; }
function isHrOrAbove(){ return S.me && (S.me.role==="hr_admin" || S.me.role==="super_admin"); }
function isSuperAdmin(){ return S.me && S.me.role==="super_admin"; }
function isSeniorOf(employeeId){
  const e = S.employeesCache.find(e=>e.id===employeeId);
  return !!(S.me && e && e.reportsTo === S.me.id);
}

// ---------------- nav / shell ----------------
function renderNav(){
  const userItems = [
    { id:"dashboard", label:"Dashboard", show:true },
    { id:"my-profile", label:"My Profile", show:true },
    { id:"directory", label:"Directory", show:true },
    { id:"my-leave", label:"My Leave", show:true },
    { id:"my-attendance", label:"My Attendance", show:true },
    { id:"resignation", label:"Resignation", show:true },
    { id:"my-time", label:"Time Tracker", show:true },
    { id:"policies", label:"Policies", show:true },
    { id:"holidays", label:"Holiday Calendar", show:true },
    { id:"my-salary", label:"My Salary", show:true },
    { id:"my-files", label:"My Documents", show:true },
    { id:"regularisation", label:"Regularisation", show:true },
    { id:"requests", label:"Other Requests", show:true },
  ];
  const approverItems = [
    { id:"approvals", label:"Approvals", show: S.me.role==="senior" || isHrOrAbove() },
    { id:"offboarding", label:"Offboarding", show: S.me.role==="senior" || isHrOrAbove() },
  ];
  const adminItems = [
    { id:"employees", label:"Employees", show: isHrOrAbove() },
    { id:"departments", label:"Departments", show: isHrOrAbove() },
    { id:"resignations-admin", label:"Resignations", show: isHrOrAbove() },
    { id:"onboarding", label:"Onboarding", show: isHrOrAbove() },
    { id:"hr-letters", label:"HR Letters", show: isHrOrAbove() },
    { id:"leave-policy", label:"Leave Policy", show: isHrOrAbove() },
    { id:"shifts", label:"Shifts", show: isHrOrAbove() },
    { id:"attendance-records", label:"Attendance Records", show: isHrOrAbove() },
    { id:"attendance-import", label:"Attendance Import", show: isHrOrAbove() },
    { id:"salary-import", label:"Salary Import", show: isHrOrAbove() },
    { id:"companies", label:"Companies", show: isSuperAdmin() },
  ];
  const nav = document.getElementById("nav");
  nav.innerHTML = "";

  if(isHrOrAbove()){
    const toggle = document.createElement("div");
    toggle.className = "nav-mode-toggle";
    const userBtn = document.createElement("button");
    userBtn.textContent = "User Control";
    userBtn.className = S.navMode!=="admin" ? "active" : "";
    userBtn.onclick = ()=>{ S.navMode = "user"; renderNav(); navigateTo("dashboard"); };
    const adminBtn = document.createElement("button");
    adminBtn.textContent = "Admin Control";

function isWeekend(dateStr){ const d = new Date(dateStr).getDay(); return d===0 || d===6; }
async function countLeaveDaysWithSandwich(fromStr, toStr, companyId){
  const from = new Date(fromStr), to = new Date(toStr);
  if(to < from) return { total:0, weekendHolidayDays:0 };
  const holSnap = await getDocs(collection(db,"holidays"));
  const holidays = holSnap.docs.map(d=>d.data()).filter(h=>h.companyId==="ALL"||h.companyId===companyId).map(h=>h.date);
  let total = 0, wh = 0;
  for(let d=new Date(from); d<=to; d.setDate(d.getDate()+1)){
    const iso = d.toISOString().slice(0,10);
    total++;
    if(isWeekend(iso) || holidays.includes(iso)) wh++;
  }
  return { total, weekendHolidayDays: wh };
}
async function autoApproveStaleLeaveRequests(reqs){
  const now = new Date();
  for(const r of reqs){
    if(r.status !== "pending") continue;
    const createdMs = r.createdAt && r.createdAt.seconds ? r.createdAt.seconds*1000 : null;
    const daysSinceApplied = createdMs ? (now - createdMs)/86400000 : 0;
    const daysUntilLeave = (new Date(r.fromDate).getTime() - now.getTime())/86400000;
    const shouldAutoApprove = daysSinceApplied >= 3 || (daysUntilLeave <= 1 && daysUntilLeave >= 0);
    if(!shouldAutoApprove) continue;
    const employeeId = r.employeeId || r.uid;
    await updateDoc(doc(db,"leaveRequests", r.id), { status:"approved", approverComment:"Auto-approved (no manager response within SLA)", decidedAt: serverTimestamp() });
    const balRef = doc(db,"employees", employeeId, "leaveBalances", `${r.typeCode}_${thisYear()}`);
    const balSnap = await getDoc(balRef);
    if(balSnap.exists()) await updateDoc(balRef, { used: balSnap.data().used + r.days });
    sendEmail({ to_email: employeeEmail(employeeId), status:"approved (auto)", leave_type: r.typeCode });
    r.status = "approved"; r.approverComment = "Auto-approved (no manager response within SLA)";
  }
}

window.submitApplyLeave = async function(){
  const typeCode = document.getElementById("al-type").value;
  const from = document.getElementById("al-from").value;
  const to = document.getElementById("al-to").value;
  const reason = document.getElementById("al-reason").value.trim();
  if(!typeCode || !from || !to){ toast("Fill in leave type and dates", "error"); return; }
  const { total: days } = await countLeaveDaysWithSandwich(from, to, S.me.companyId);
  if(days <= 0){ toast("'To' date must be on or after 'from' date", "error"); return; }
  if(!S.me.reportsTo){ toast("You have no reporting Senior set — ask HR to fix this first", "error"); return; }

  const year = thisYear();
  const balRef = doc(db, "employees", S.me.id, "leaveBalances", `${typeCode}_${year}`);
  const balSnap = await getDoc(balRef);
  const leaveType = S.leaveTypesCache.find(t=>t.id===typeCode);
  if(!balSnap.exists()){
    await setDoc(balRef, { typeCode, year, opening: leaveType ? leaveType.annualQuota : 0, accrued:0, used:0 });
  }
  const bal = (await getDoc(balRef)).data();
  const remaining = bal.opening + bal.accrued - bal.used;
  if(days > remaining){
    toast(`Insufficient balance — only ${remaining} ${typeCode} day(s) left`, "error");
    return;

  await addDoc(collection(db,"leaveRequests"), {
    employeeId: S.me.id, typeCode, fromDate: from, toDate: to, days, reason,
    status:"pending", approverId: S.me.reportsTo, approverComment:"",

    leave_type: typeCode, from_date: from, to_date: to, days, reason
  });

  closeModal();
  navigateTo("my-leave");
};

// ---------------- spreadsheet import helpers (shared by Attendance Import + Salary Import) ----------------
function rowsFromCsvText(raw){
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  if(!lines.length) return [];
  const header = lines[0].split(",").map(h=>h.trim());
  return lines.slice(1).map(line=>{
    const cols = line.split(",").map(c=>c.trim());
    const row = {}; header.forEach((h,i)=>row[h]=cols[i]!==undefined?cols[i]:"");
    return row;
  });
}
async function parseSpreadsheetFile(file){
  // CSV files are routed through our own plain-text parser rather than SheetJS —
  // SheetJS's CSV reader auto-detects date-like strings (e.g. "2026-09-02") and
  // reformats them to locale short dates (e.g. "9/2/26"), silently corrupting the
  // ISO date values this app relies on (used directly in Firestore doc IDs).
  // Real .xlsx/.xls files don't have this problem since aoa_to_sheet / Excel
  // itself stores text cells as text, so SheetJS is safe to use for those.
  if(/\.csv$/i.test(file.name)){
    const text = await file.text();
    return rowsFromCsvText(text.trim());
  }
  const buf = await file.arrayBuffer();
  const wb = XLSX.read(buf, { type: "array" });
  const sheet = wb.Sheets[wb.SheetNames[0]];
  // raw:true (not raw:false) — if a "date" column got auto-typed as a real Excel
  // date cell (common when someone just types a date into a plain cell), raw:false
  // would render it using that cell's number format, which is often a locale short
  // date (e.g. "9/2/26") rather than ISO. Reading raw and converting the "date"
  // column ourselves keeps it as YYYY-MM-DD regardless of the cell's own formatting.
  const rows = XLSX.utils.sheet_to_json(sheet, { defval: "", raw: true });
  return rows.map(r=>{
    const norm = {};
    Object.keys(r).forEach(k=>{
      const key = k.trim();
      let val = r[k];
      if(key.toLowerCase()==="date" && typeof val==="number"){
        const p = XLSX.SSF.parse_date_code(val);
        val = `${p.y}-${String(p.m).padStart(2,"0")}-${String(p.d).padStart(2,"0")}`;
      }
      norm[key] = String(val).trim();
    });
    return norm;
  });
}

window.submitAttendanceImport = async function(){
  const resultBox = document.getElementById("att-import-result");
  let rows;
  try{ rows = await getImportRows("att-file", "att-csv"); }
  catch(e){ console.error(e); toast("Could not read that file", "error"); return; }
  if(!rows.length){ toast("Attach a file or paste some rows first", "error"); return; }
  let ok=0, fail=0; const failedEmails=[];
  for(const row of rows){
    if(!row.email || !row.date){ fail++; continue; }
    const match = S.employeesCache.find(e=>e.email.toLowerCase()===String(row.email).toLowerCase());
    if(!match){ fail++; failedEmails.push(row.email); continue; }
    try{
      await setDoc(doc(db,"attendance",`${match.id}_${row.date}`), {
        employeeId: match.id, date: row.date,
        firstEntry: row.firstEntry||row.inTime||"", lastExit: row.lastExit||row.outTime||"",
        recentEntry: row.recentEntry||row.lastExit||row.outTime||"",
        hoursIn: row.hoursIn||"", hoursOut: row.hoursOut||"", totalHours: row.totalHours||"",
        status: row.status||"present", overtimeMin: Number(row.overtimeMin)||0, remark: row.remark||"",
        source:"manual"
      });
      ok++;
    }catch(e){ fail++; }
  }
  resultBox.innerHTML = `<div class="${fail? 'err-msg':'ok-msg'}">Imported ${ok} row(s), ${fail} failed${failedEmails.length? ' (unmatched: '+failedEmails.join(", ")+')':''}.</div>`;
};

window.decideResignation = async function(id, employeeId, status, dateOfResignation){
  const comment = status==="rejected" ? (prompt("Optional comment:")||"") : "";
  await updateDoc(doc(db,"resignations",id), { status, approverComment:comment, decidedAt: serverTimestamp() });
  if(status==="approved"){
    await updateDoc(doc(db,"employees",employeeId), { dateOfExit: dateOfResignation });
    const idx = S.employeesCache.findIndex(e=>e.id===employeeId); if(idx>-1) S.employeesCache[idx].dateOfExit = dateOfResignation;
  }else{
    await updateDoc(doc(db,"employees",employeeId), { status:"active" });
    const idx = S.employeesCache.findIndex(e=>e.id===employeeId); if(idx>-1) S.employeesCache[idx].status = "active";
  }
  sendEmail({ to_email: employeeEmail(employeeId), status, message:`Your resignation has been ${status}${comment?` — ${comment}`:""}.` });
  toast(`Resignation ${status}`,"success"); navigateTo(S.view);
};

function computeYearsMonths(fromISO, toISO){
  if(!fromISO) return null;
  const from = new Date(fromISO);
  const to = toISO ? new Date(toISO) : new Date();
  let months = (to.getFullYear()-from.getFullYear())*12 + (to.getMonth()-from.getMonth());
  if(to.getDate() < from.getDate()) months--;
  if(months < 0) return null;
  const years = Math.floor(months/12);
  const rem = months%12;
  return `${years} year(s) ${rem} month(s)`;
}
function computeAge(dob){ return computeYearsMonths(dob); }

window.submitBulkImport = async function(){
  const companyId = document.getElementById("bi-company").value;
  const role = document.getElementById("bi-role").value;
  const fallbackReportsTo = document.getElementById("bi-reportsto").value || null;
  const raw = document.getElementById("bi-csv").value.trim();
  const resultBox = document.getElementById("bi-result");
  if(!raw){ toast("Paste at least one row", "error"); return; }
  const lines = raw.split("\n").map(l=>l.trim()).filter(Boolean);
  const results = [];
  const createdForLinking = []; // { uid, managerName, shiftName }
  resultBox.innerHTML = `<div class="muted">Importing 0 / ${lines.length}…</div>`;
  for(let i=0; i<lines.length; i++){
    const [name, email, phone, doj, managerName, shiftName] = lines[i].split(",").map(c=>(c||"").trim());
    resultBox.innerHTML = `<div class="muted">Importing ${i+1} / ${lines.length}…</div>`;
    if(!name || !email){ results.push({ name: name||"(blank)", email: email||"", status:"failed", note:"missing name or email" }); continue; }
    if(S.employeesCache.find(e=>e.email.toLowerCase()===email.toLowerCase())){
      results.push({ name, email, status:"skipped", note:"already exists" }); continue;
    }
    const password = genTempPassword();
    try{
      const uid = await createOneEmployee({ name, email, phone, password, companyId, role, reportsTo: fallbackReportsTo, doj });
      results.push({ name, email, status:"created", note: password });
      if(managerName || shiftName) createdForLinking.push({ uid, managerName, shiftName });
    }catch(err){
      results.push({ name, email, status:"failed", note: err.message || "error" });
    }
  }
  // Second pass: resolve manager/shift names now that every row in this batch exists.
  let linked = 0, linkFailed = [];
  for(const row of createdForLinking){
    const patch = {};
    if(row.managerName){
      const mgr = findEmployeeByName(row.managerName);
      if(mgr) patch.reportsTo = mgr.id;
      else linkFailed.push(`${row.managerName} (manager, not found)`);
    }
    if(row.shiftName){
      const sh = S.shiftsCache.find(s=>s.name.trim().toLowerCase()===row.shiftName.trim().toLowerCase());
      if(sh) patch.shiftId = sh.id;
      else linkFailed.push(`${row.shiftName} (shift, not found)`);
    }
    if(Object.keys(patch).length){
      await updateDoc(doc(db,"employees",row.uid), patch);
      const idx = S.employeesCache.findIndex(e=>e.id===row.uid);
      if(idx>-1) S.employeesCache[idx] = { ...S.employeesCache[idx], ...patch };
      linked++;
    }
  }
  const ok = results.filter(r=>r.status==="created").length;
  resultBox.innerHTML = `
    <div class="${ok===results.length ? 'ok-msg':'err-msg'}">Created ${ok} of ${results.length}. Linked manager/shift on ${linked} row(s).${linkFailed.length?' Could not match: '+linkFailed.join(", "):''}</div>
    <div class="table-wrap" style="margin-top:10px;max-height:220px;overflow-y:auto;">
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Status</th><th>Temp password / note</th></tr></thead>
        <tbody>
          ${results.map(r=>`<tr><td>${r.name}</td><td>${r.email}</td><td><span class="pill pill-${r.status==='created'?'approved':r.status==='skipped'?'pending':'rejected'}">${r.status}</span></td><td class="muted">${r.note}</td></tr>`).join("")}
        </tbody>
      </table>
    </div>
    <p class="muted" style="font-size:12px;">Save the temporary passwords now — they aren't shown again. Share them with each employee securely.</p>
  `;
  renderNav();
};

function resizeImageFile(file, maxDim, quality){
  maxDim = maxDim || 900; quality = quality || 0.72;
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = (e) => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        let { width, height } = img;
        if(width > maxDim || height > maxDim){
          const scale = maxDim / Math.max(width, height);
          width = Math.round(width*scale); height = Math.round(height*scale);
        }
        const canvas = document.createElement("canvas");
        canvas.width = width; canvas.height = height;
        canvas.getContext("2d").drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function offboardingStageUnlocked(r, stage){
  if(stage==="it") return true;
  if(stage==="hr") return r.itStatus==="approved";
  if(stage==="manager") return r.hrStatus==="approved";
  return false;
}
function offboardingCanAct(r, stage){
  if(stage==="manager") return isSeniorOf(r.employeeId) || isHrOrAbove();
  return isHrOrAbove();
}
function offboardingOverallStatus(r){
  if(r.itStatus==="rejected"||r.hrStatus==="rejected"||r.managerStatus==="rejected") return "rejected";
  if(r.itStatus==="approved"&&r.hrStatus==="approved"&&r.managerStatus==="approved") return "cleared";
  return "pending";
}
function offboardingStageCell(stage, r){
  const status = r[stage+"Status"]||"pending";
  if(status==="approved") return `<span class="pill pill-approved">Cleared</span>`;
  if(status==="rejected") return `<span class="pill pill-rejected">Rejected</span>`;
  if(!offboardingStageUnlocked(r, stage)) return `<span class="pill pill-pending">Waiting</span>`;
  if(offboardingCanAct(r, stage)){
    return `<button class="small-btn primary" onclick="decideOffboardingStage('${r.id}','${stage}','approved')">Approve</button> <button class="small-btn danger" onclick="decideOffboardingStage('${r.id}','${stage}','rejected')">Reject</button>`;
  }
  return `<span class="pill pill-pending">Pending</span>`;
}

function substituteLetterTokens(body, emp, company, today, totalSalary){
  return body
    .replaceAll("{{name}}", emp.name||"")
    .replaceAll("{{company}}", company.name||"")
    .replaceAll("{{doj}}", emp.doj?fmtDate(emp.doj):"")
    .replaceAll("{{designation}}", emp.designationId?desigName(emp.designationId):"")
    .replaceAll("{{department}}", emp.departmentId?deptName(emp.departmentId):"")
    .replaceAll("{{salary}}", fmtInr(totalSalary))
    .replaceAll("{{today}}", today);
}

window.generateLetter = async function(){
  const uid = document.getElementById("hl-emp").value;
  const type = document.getElementById("hl-type").value;
  const emp = S.employeesCache.find(e=>e.id===uid);
  if(!emp){ toast("Pick an employee","error"); return; }
  const salSnap = await getDocs(collection(db,"employees",uid,"salaryComponents"));
  const salRows = salSnap.docs.map(d=>d.data());
  const grossRow = salRows.find(r=>/gross salary/i.test(r.label||""));
  const total = grossRow ? (Number(grossRow.pm)||0) : salRows.reduce((s,r)=>s+(r.section!=="flexi" && !/take home/i.test(r.label||"") ? (Number(r.pm)||0) : 0),0);
  const today = fmtDate(new Date().toISOString().slice(0,10));
  const company = companyById(emp.companyId);
  let title, bodyHtml;
  if(type.startsWith("custom:")){
    const snap = await getDoc(doc(db,"letterTemplates",type.slice(7)));
    if(!snap.exists()){ toast("Template not found","error"); return; }
    const tpl = snap.data();
    title = tpl.name;
    bodyHtml = substituteLetterTokens(tpl.bodyHtml, emp, company, today, total);
  }else{
    const titles = { offer:"Offer Letter", experience:"Experience Letter", relieving:"Relieving Letter", salary:"Salary Certificate" };
    const bodies = {
      offer: `<p>Dear ${emp.name},</p><p>We are pleased to offer you employment with ${company.name}, part of Chamaria Group, effective ${fmtDate(emp.doj)}. We look forward to having you on the team.</p>`,
      experience: `<p>This is to certify that ${emp.name} has been employed with ${company.name} since ${fmtDate(emp.doj)} and continues to serve in good standing.</p>`,
      relieving: `<p>This is to certify that ${emp.name} was relieved from their duties at ${company.name}. We wish them well in their future endeavours.</p>`,
      salary: `<p>This is to certify that ${emp.name} is employed with ${company.name} with a total monthly compensation of ${fmtInr(total)}.</p>`,
    };
    title = titles[type];
    bodyHtml = bodies[type];
  }
  document.getElementById("letter-preview").innerHTML = `
    <div id="letter-doc" style="border:1px solid var(--line);border-radius:8px;padding:32px;background:#fff;color:#111;max-width:640px;">
      ${companyLetterheadHtml(company)}
      <p style="text-align:right;">${today}</p>
      <h3>${title}</h3>
      <div id="letter-body-editable" contenteditable="true" style="outline:1px dashed #ccc;padding:4px;min-height:60px;">${bodyHtml}</div>
      <p style="margin-top:40px;">For ${company.name},</p>
      <p style="margin-top:40px;">Authorised Signatory</p>
    </div>
    <p class="muted" style="font-size:12px;margin-top:8px;">Click inside the letter text above to edit, copy-paste, or rewrite before printing.</p>
    <button class="btn btn-primary" style="margin-top:8px;margin-right:8px;" onclick="printLetter()">Print / Save as PDF</button>
    <button class="btn btn-ghost" style="margin-top:8px;" onclick="saveLetterAsTemplate()">Save as new template</button>
  `;
};

        <div><div class="muted" style="font-size:12px;">Prior Experience</div><div>${e.priorExperience||"—"}</div></div>
        <div><div class="muted" style="font-size:12px;">Reporting Manager</div><div>${e.reportsTo?employeeName(e.reportsTo):"—"}</div></div>
        <div><div class="muted" style="font-size:12px;">Shift</div><div>${e.shiftId?shiftName(e.shiftId):"—"}</div></div>
        <div><div class="muted" style="font-size:12px;">Work Phone Ext.</div><div>${e.workPhoneExt||"—"}</div></div>
        <div><div class="muted" style="font-size:12px;">Seating Location</div><div>${e.seatingLocation||"—"}</div></div>
        <div><div class="muted" style="font-size:12px;">Date of Exit</div><div>${e.dateOfExit?fmtDate(e.dateOfExit):"—"}</div></div>
      </div>
    </div></div>
    <div class="panel"><div class="panel-head"><h3>Personal information</h3></div><div class="panel-body">
      <div class="grid grid-3">
        <div><div class="muted" style="font-size:12px;">Date of Birth</div><div>${e.dob?fmtDate(e.dob):"—"}</div></div>
        <div><div class="muted" style="font-size:12px;">Age</div><div>${age}</div></div>
        <div><div class="muted" style="font-size:12px;">Gender</div><div>${e.gender||"—"}</div></div>
        <div><div class="muted" style="font-size:12px;">Marital Status</div><div>${e.maritalStatus||"—"}</div></div>
        <div><div class="muted" style="font-size:12px;">Core Skills</div><div>${e.coreSkills||"—"}</div></div>
        <div><div class="muted" style="font-size:12px;">Personal Email</div><div>${e.personalEmail||"—"}</div></div>

        <div><div class="muted" style="font-size:12px;">UAN</div><div>${e.uan||"—"}</div></div>

window.openViewProfileModal = async function(uid){
  const e = S.employeesCache.find(e=>e.id===uid);
  const reqSnap = await getDocs(query(collection(db,"leaveRequests"), where("employeeId","==",uid)));
  const leaveRows = reqSnap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>((b.createdAt&&b.createdAt.seconds)||0)-((a.createdAt&&a.createdAt.seconds)||0));
  openModal("Profile — " + e.name, `<div style="max-height:60vh;overflow-y:auto;">${profileReadonlyHtml(e)}
    <div class="panel" style="margin-top:16px;"><div class="panel-head"><h3>Leave history</h3></div>
    <div class="table-wrap"><table><thead><tr><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Status</th></tr></thead>
    <tbody>${leaveRows.length?leaveRows.map(r=>`<tr><td>${r.typeCode}</td><td>${fmtDate(r.fromDate)}</td><td>${fmtDate(r.toDate)}</td><td>${r.days}</td><td><span class="pill pill-${r.status}">${r.status}</span></td></tr>`).join(""):'<tr><td colspan="5" class="empty-state">No leave requests.</td></tr>'}</tbody></table></div></div>
  </div><div class="actions"><button class="btn btn-ghost" onclick="closeModal()">Close</button></div>`);
};

async function renderMyProfile(){
  const e = S.me;
  let onboardingHtml = "";
  const obSnap = await getDocs(query(collection(db,"onboardingTasks"), where("employeeId","==",e.id)));
  const obTasks = obSnap.docs.map(d=>d.data());
  if(obTasks.length){
    const done = obTasks.filter(t=>t.done).length;
    onboardingHtml = `<div class="card stat-card" style="margin-bottom:16px;"><div class="stat-label">Onboarding status</div><div class="stat-value" style="font-size:18px;">${done} / ${obTasks.length} done</div></div>`;
  }
  return `
    ${onboardingHtml}
    ${profileReadonlyHtml(e)}
    <div class="panel" style="margin-top:16px;"><div class="panel-head"><h3>Edit my details</h3><span class="muted" style="font-size:12px;">Work info above is set by HR — contact them to change it</span></div>
      <div class="panel-body">
        <div class="grid grid-2">
          <div class="field"><label>Nick name</label><input id="mp-nick" value="${e.nickName||""}"></div>
          <div class="field"><label>Personal mobile</label><input id="mp-phone" value="${e.phone||""}"></div>
          <div class="field"><label>Date of birth</label><input type="date" id="mp-dob" value="${e.dob||""}"></div>
          <div class="field"><label>Gender</label><select id="mp-gender">
            ${selOpt("", "— not set —", e.gender)}${selOpt("Male","Male",e.gender)}${selOpt("Female","Female",e.gender)}${selOpt("Other","Other",e.gender)}${selOpt("Prefer not to say","Prefer not to say",e.gender)}</select></div>
          <div class="field"><label>Marital status</label><select id="mp-marital">
            ${selOpt("", "— not set —", e.maritalStatus)}${selOpt("Single","Single",e.maritalStatus)}${selOpt("Married","Married",e.maritalStatus)}${selOpt("Other","Other",e.maritalStatus)}</select></div>
          <div class="field"><label>Prior experience (before joining)</label><input id="mp-priorexp" value="${e.priorExperience||""}" placeholder="e.g. 5 year(s) 2 month(s)"></div>
          <div class="field"><label>Core skills</label><input id="mp-skills" value="${e.coreSkills||""}" placeholder="comma separated"></div>
          <div class="field"><label>Personal email</label><input type="email" id="mp-pemail" value="${e.personalEmail||""}"></div>
          <div class="field"><label>PAN</label><input id="mp-pan" value="${e.pan||""}"></div>
          <div class="field"><label>UAN</label><input id="mp-uan" value="${e.uan||""}"></div>
          <div class="field"><label>Insurance policy number</label><input id="mp-insno" value="${e.insurancePolicyNumber||""}"></div>
          <div class="field"><label>Insurance from</label><select id="mp-insfrom">
            ${selOpt("", "— not set —", e.insuranceFrom)}${selOpt("Company","Company",e.insuranceFrom)}${selOpt("Personal","Personal",e.insuranceFrom)}${selOpt("None","None",e.insuranceFrom)}</select></div>
        </div>
        <div class="field"><label>Present address</label><textarea id="mp-present" rows="2">${e.presentAddress||""}</textarea></div>
        <div class="field"><label>Permanent address</label><textarea id="mp-permanent" rows="2">${e.permanentAddress||""}</textarea></div>
        <div class="field"><label>About me</label><textarea id="mp-about" rows="2">${e.aboutMe||""}</textarea></div>
        <button class="btn btn-primary" onclick="submitMyProfile()">Save my details</button>
      </div>
    </div>`;
}
window.submitMyProfile = async function(){
  const patch = {
    nickName: document.getElementById("mp-nick").value.trim(),
    phone: document.getElementById("mp-phone").value.trim(),
    dob: document.getElementById("mp-dob").value || null,
    gender: document.getElementById("mp-gender").value,
    maritalStatus: document.getElementById("mp-marital").value,
    priorExperience: document.getElementById("mp-priorexp").value.trim(),
    coreSkills: document.getElementById("mp-skills").value.trim(),
    personalEmail: document.getElementById("mp-pemail").value.trim(),
    pan: document.getElementById("mp-pan").value.trim(),
    uan: document.getElementById("mp-uan").value.trim(),
    insurancePolicyNumber: document.getElementById("mp-insno").value.trim(),
    insuranceFrom: document.getElementById("mp-insfrom").value,
    presentAddress: document.getElementById("mp-present").value.trim(),
    permanentAddress: document.getElementById("mp-permanent").value.trim(),
    aboutMe: document.getElementById("mp-about").value.trim(),
  };
  await updateDoc(doc(db,"employees",S.me.id), patch);
  S.me = { ...S.me, ...patch };
  const meIdx = S.employeesCache.findIndex(e=>e.id===S.me.id);
  if(meIdx > -1) S.employeesCache[meIdx] = { ...S.employeesCache[meIdx], ...patch };
  toast("Profile updated","success");
  navigateTo("my-profile");
};
