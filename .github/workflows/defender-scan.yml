name: Defender scan Remote PC

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to scan
        default: remote-pc-latest

jobs:
  scan:
    runs-on: windows-latest
    steps:
      - name: Download exe
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/REMOTE-PC.exe" -OutFile REMOTE-PC.exe
          Get-FileHash REMOTE-PC.exe -Algorithm SHA256
      - name: Scan with Microsoft Defender
        shell: pwsh
        run: |
          Update-MpSignature -ErrorAction SilentlyContinue
          Get-MpComputerStatus | Select-Object AMRunningMode, AntivirusSignatureVersion
          & "$env:ProgramFiles\Windows Defender\MpCmdRun.exe" -Scan -ScanType 3 -File "$PWD\REMOTE-PC.exe" -DisableRemediation
          $code = $LASTEXITCODE
          Get-MpThreatDetection | Select-Object ThreatID, Resources | Format-List
          Get-MpThreat | Select-Object ThreatName, SeverityID | Format-List
          if ($code -ne 0) { Write-Error "Defender flagged the file (exit $code)"; exit 1 }
          "Clean"
