name: Build SS-Connect Desktop (Windows)

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Test
        run: dotnet test desktop/SSConnect.sln -c Release
      - name: Build
        run: dotnet build desktop/src/SSConnect.App -c Release
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ss-connect-desktop-latest
          name: SS-Connect Desktop (Windows)
          make_latest: false
          body: |
            SS-Connect for Windows — screen sharing with mouse and keyboard control (only after the other person clicks Allow).
            Free sessions are limited to 40 minutes.
            Windows may show "Unknown publisher": click More info → Run anyway. On first run, allow it through Windows Firewall.
          files: desktop/src/SSConnect.App/bin/Release/net48/SS-Connect.exe
